    #timer-compact {

    }

    #draft-stage {
      position: relative;
      min-height: 132px;
    }

    #typewriter-focus-layer {
      position: absolute;
      z-index: 1;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      mask-image: linear-gradient(
        to bottom,
        transparent 0,
        transparent var(--typewriter-mask-start, 0%),
        #000 var(--typewriter-mask-end, 18%),
        #000 100%
      );
      -webkit-mask-image: linear-gradient(

        transparent var(--typewriter-mask-start, 0%),
        #000 var(--typewriter-mask-end, 18%),
        #000 100%

    #typewriter-focus-copy {

    #draft-input {

    body[data-typewriter-mode="true"] #draft-input:not([data-heading])::selection {
      background: rgba(89, 194, 255, .3);

    body[data-typewriter-mode="true"] #draft-input:not([data-heading])::placeholder {
      color: rgba(154, 170, 181, .4);
      -webkit-text-fill-color: rgba(154, 170, 181, .4);

    body:not([data-typewriter-mode="true"]) #typewriter-focus-layer,

    .typewriter-context-control {

      justify-content: center;

      text-align: center;
      transform: translateX(-50%);

    body[data-typewriter-mode="true"] #composer {

      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;

        to bottom,
        transparent 0,
        transparent var(--typewriter-glass-start, 22%),
        #000 var(--typewriter-glass-solid, 46%),
        #000 100%
      );
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0,
        transparent var(--typewriter-glass-start, 22%),
        #000 var(--typewriter-glass-solid, 46%),
        #000 100%
      );
      backdrop-filter: blur(22px) saturate(125%);
      -webkit-backdrop-filter: blur(22px) saturate(125%);

    .commit-receipt {
      position: fixed !important;

      transform: translate(-50%, 0) scale(1);

      border-radius: 999px;
      background: rgba(24, 20, 12, .84);

      color: #f2d68f;

      backdrop-filter: blur(16px);

      background: rgba(24, 20, 12, .86);
      box-shadow: 0 12px 38px rgba(0, 0, 0, .38), 0 0 32px rgba(197, 160, 89, .14);
      color: #f5d985;
      font: 700 clamp(25px, 4vw, 40px)/1 var(--mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: .035em;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -8px) scale(.96);
      transition: opacity .22s, transform .28s var(--ease), border-color .2s, box-shadow .2s;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    #timer-focus-cue[data-visible="true"] {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    #timer-focus-cue[data-final="true"] {
      border-color: rgba(245, 217, 133, .7);
      box-shadow: 0 14px 44px rgba(0, 0, 0, .42), 0 0 44px rgba(228, 190, 95, .24);
    }

    #draft-input::placeholder {
      color: rgba(154, 170, 181, .4);
    }

    #draft-input[data-heading="1"] {
      font: 620 clamp(27px, 3.4vw, 42px)/1.2 var(--sans);
    }

    #draft-input[data-heading="2"] {
      font: 600 clamp(24px, 2.8vw, 34px)/1.25 var(--sans);
    }

    #draft-input[data-heading="3"] {
      font: 600 clamp(21px, 2.35vw, 29px)/1.3 var(--sans);
    }

    .composer-bottom {
      min-height: 44px;
      justify-content: space-between;
      gap: 18px;
      padding: 8px 18px 12px;
      border-top: 1px solid rgba(179, 229, 255, .07);
    }

    #commit-hint {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .width-control {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
    }

    .width-control svg {

      height: 14px;

    #width-slider {

      height: 20px;

    .composer-grip {

      height: 80px;

      cursor: ew-resize;
      opacity: .38;
      transform: translateY(-50%);
      touch-action: none;
      transition: opacity .16s;
    }

    .composer-grip:hover,
    .composer-grip:focus-visible {
      opacity: 1;

    .composer-grip::before {
      position: absolute;
      top: 18px;

      width: 2px;

    .composer-grip.left { right: 100%; }
    .composer-grip.right { left: 100%; }

    #empty-graph {
      position: fixed;
      z-index: 3;

      text-align: center;
      transform: translate(-50%, -50%);

    body:not([data-view="graph"]) #empty-graph,
    #empty-graph[hidden] {
      display: none;
    }

    #graph-legend {
      position: fixed;
      z-index: 8;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: max(18px, env(safe-area-inset-left));

      gap: 14px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(9, 11, 17, .72);
      color: var(--paper-faint);
      font: 9px/1 var(--mono);
      letter-spacing: .06em;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

    body:not([data-view="graph"]) #graph-legend {
      display: none;

      gap: 5px;
      max-width: calc(100vw - 24px);
      padding: 5px;
      border: 1px solid rgba(179, 229, 255, .12);
      border-radius: 999px;
      background: rgba(9, 11, 17, .78);
      box-shadow: 0 12px 34px rgba(0, 0, 0, .24);
      pointer-events: auto;
      transform: translateX(-50%);
      backdrop-filter: blur(16px) saturate(125%);
      -webkit-backdrop-filter: blur(16px) saturate(125%);
    }

    body:not([data-view="graph"]) #graph-lens {
      display: none;

    #graph-lens-status {
      position: fixed;
      z-index: 8;
      top: calc(var(--topbar-height) + max(204px, env(safe-area-inset-top)));

      border: 1px solid rgba(179, 229, 255, .09);
      border-radius: 9px;
      background: rgba(9, 11, 17, .7);
      color: var(--paper-faint);
      font: 9px/1.35 var(--mono);
      pointer-events: none;
      text-align: center;
      transform: translateX(-50%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    #graph-lens-status[hidden],
    body:not([data-view="graph"]) #graph-lens-status {
      display: none;
    }

    .graph-lens-label {
      padding: 0 7px 0 9px;
      color: var(--paper-faint);
      font: 9px/1 var(--mono);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .graph-lens-button {
      min-width: 58px;
      min-height: 44px;
      padding: 0 10px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--paper-dim);
      cursor: pointer;
      font: 600 10px/1 var(--mono);
      letter-spacing: .025em;
      transition: color .16s, background .16s, box-shadow .16s;
    }

    .graph-lens-button:hover,
    .graph-lens-button[aria-pressed="true"] {
      background: rgba(89, 194, 255, .12);
      color: var(--cyan-bright);
      box-shadow: inset 0 0 0 1px rgba(89, 194, 255, .16);

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-mark {

      background: var(--cyan);
      box-shadow: 0 0 8px rgba(89, 194, 255, .3);

      border: 1.5px solid var(--amber);
      background: transparent;
    }

    .legend-mark.lonely {
      border: 1.5px solid var(--orange);
      background: rgba(232, 93, 74, .12);
      border-radius: 2px;
    }

    .legend-line {
      width: 24px;
      height: 0;
      border-top: 2px solid rgba(120, 151, 172, .8);
    }

    .legend-line.cohesion {
      border-top: 2px dashed var(--cyan);
      filter: drop-shadow(0 0 3px rgba(89, 194, 255, .45));
    }

    .legend-line.hierarchy {
      border-top: 2px dotted var(--amber);
    }

    #structure-view {
      z-index: 7;
      overflow: auto;
      padding:
        calc(var(--topbar-height) + max(154px, env(safe-area-inset-top)))
        max(20px, env(safe-area-inset-right))
        max(80px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
      background:
        radial-gradient(circle at 50% 0%, rgba(89, 194, 255, .07), transparent 30rem),
        var(--ink);
    }

    body:not([data-view="structure"]) #structure-view {
      display: none;
    }

    #echo-view {
      z-index: 7;
      overflow: auto;
      padding:
        calc(var(--topbar-height) + max(154px, env(safe-area-inset-top)))
        max(20px, env(safe-area-inset-right))
        max(80px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
      background:
        radial-gradient(circle at 22% 12%, rgba(89, 194, 255, .085), transparent 31rem),
        radial-gradient(circle at 82% 42%, rgba(197, 160, 89, .045), transparent 26rem),
        var(--ink);
    }

    body:not([data-view="echo"]) #echo-view {
      display: none;
    }

    #fulltext-view {
      overflow: auto;
      padding:
        calc(var(--topbar-height) + max(30px, env(safe-area-inset-top)))
        max(18px, env(safe-area-inset-right))
        max(42px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
      background:
        radial-gradient(circle at 75% 10%, rgba(89, 194, 255, .055), transparent 32%),
        var(--ink);

      display: none;
    }

    .fulltext-shell {
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .fulltext-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 22px;
    }

    .fulltext-head h1 {
      margin: 4px 0 5px;
      color: var(--paper);
      font: 650 clamp(25px, 4vw, 42px)/1.08 var(--serif);
    }

    .fulltext-head p,
    .fulltext-status {
      margin: 0;
      color: var(--paper-faint);
      font: 11px/1.55 var(--mono);
    }

    .fulltext-actions,
    .fulltext-view-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .fulltext-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 250px;
      align-items: start;
      gap: 20px;
    }

    .fulltext-paper,
    .fulltext-sidebar {
      border: 1px solid rgba(179, 229, 255, .13);
      border-radius: 18px;
      background: rgba(14, 17, 24, .9);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .28);
    }

    .fulltext-paper {
      min-height: min(720px, calc(100vh - 180px));
      padding: clamp(30px, 6vw, 76px);
    }

    .fulltext-document {
      max-width: 72ch;
      margin: 0 auto;
      color: var(--paper);
      font: 18px/1.72 var(--document-font, var(--serif));
    }

    .fulltext-document h1,
    .fulltext-document h2,
    .fulltext-document h3 {
      color: var(--paper);
      line-height: 1.18;
      text-wrap: balance;
    }

    .fulltext-document h1 { margin: 1.8em 0 .65em; font-size: 2em; }

    .fulltext-document h3 { margin: 1.45em 0 .5em; font-size: 1.18em; }
    .fulltext-document > :first-child { margin-top: 0; }
    .fulltext-document p { margin: 0 0 1.25em; }

    .fulltext-block {
      position: relative;
      scroll-margin-top: calc(var(--topbar-height) + 20px);
    }

    .fulltext-block[data-has-comments="true"]::before {
      position: absolute;
      top: .75em;
      left: -22px;
      width: 8px;
      height: 8px;
      border: 1px solid var(--cyan);
      border-radius: 50%;
      content: "";
      opacity: .72;
    }

    .fulltext-comments {
      display: grid;
      gap: 7px;
      margin: -.5em 0 1.4em;
      padding: 0 0 0 15px;
      border-left: 1px solid rgba(89, 194, 255, .38);
      color: var(--paper-dim);
      font: 12px/1.55 var(--sans);
    }

    .fulltext-comments[hidden] { display: none; }
    .fulltext-comments p { margin: 0; }

    #fulltext-markdown {
      width: 100%;
      min-height: min(720px, calc(100vh - 250px));
      resize: vertical;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--paper);
      font: 15px/1.7 var(--mono);
      tab-size: 2;
    }

    .fulltext-sidebar {
      position: sticky;
      top: calc(var(--topbar-height) + 24px);
      display: grid;
      gap: 18px;
      padding: 17px;
    }

    .fulltext-sidebar h2 {
      margin: 0 0 10px;
      color: var(--paper);
      font: 650 12px/1 var(--sans);
    }

    .fulltext-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }

    .fulltext-stat {
      padding: 10px;
      border: 1px solid rgba(179, 229, 255, .1);
      border-radius: 10px;
      background: rgba(179, 229, 255, .025);
    }

    .fulltext-stat strong,
    .fulltext-stat span { display: block; }
    .fulltext-stat strong { color: var(--paper); font: 600 17px/1 var(--mono); }

      grid-template-rows: auto minmax(0, 1fr);

    #echo-status {

      margin: 0;
      padding: 14px 17px 10px;
      border-bottom: 1px solid rgba(179, 229, 255, .07);

      font: 10px/1.5 var(--mono);
      letter-spacing: .025em;

    #echo-field {

      min-height: 365px;
      overflow: auto;
      flex-wrap: wrap;
      align-content: center;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.4vw, 18px);
      padding: clamp(22px, 4vw, 48px);

    #echo-field[data-mode="phrases"],

      align-content: start;
      grid-template-columns: 1fr;

    .echo-word,
    .echo-strip {
      border: 1px solid transparent;
      background: transparent;
      color: rgba(179, 229, 255, var(--echo-opacity, .76));
      cursor: pointer;
      transition: color .16s, border-color .16s, background .16s, opacity .16s, transform .16s;

    .echo-word {

      border-radius: 999px;

      letter-spacing: -.018em;

    .echo-word:hover,
    .echo-word:focus-visible,
    .echo-word[aria-pressed="true"] {
      border-color: rgba(255, 216, 105, .48);
      background: rgba(255, 216, 105, .07);
      color: #ffe7a6;
      transform: scale(1.035);

    .echo-strip {
      display: grid;
      min-height: 58px;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 10px 13px;
      border-color: rgba(179, 229, 255, .08);
      border-radius: 11px;
      text-align: left;

    .echo-strip:focus-visible,

      border-color: rgba(255, 216, 105, .42);
      background: rgba(255, 216, 105, .055);
      color: #ffe7a6;

    .echo-strip-copy small {
      display: block;

    .echo-strip-copy strong {
      font: 500 17px/1.25 var(--serif);

    .echo-strip-copy small,
    .echo-strip-count {

      color: var(--paper-faint);
      font: 9px/1.3 var(--mono);
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .echo-word[data-decision="intentional"],

      opacity: .47;

    .echo-word[data-decision="key"],

      color: rgba(148, 224, 196, .82);

    .echo-word[data-decision="hidden"],
    .echo-strip[data-decision="hidden"] {
      opacity: .24;
      filter: grayscale(.7);

    .echo-empty {
      align-self: center;
      justify-self: center;

    #echo-detail {

    .echo-detail-empty {
      display: grid;
      min-height: 390px;
      align-content: center;
      gap: 9px;
      color: var(--paper-faint);
      text-align: center;

    .echo-detail-empty strong {
      color: var(--paper-dim);

    }

    .echo-detail-head {
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(179, 229, 255, .08);

    .echo-detail-head h2 {

      font: 500 28px/1.08 var(--serif);
    }

    .echo-detail-head p,
    .echo-question {

      color: var(--paper-dim);

    .echo-facts {

      margin: 13px 0;

    .echo-fact {
      padding: 9px 10px;
      border: 1px solid rgba(179, 229, 255, .075);
      border-radius: 9px;
      background: rgba(179, 229, 255, .025);
    }

    .echo-fact strong,
    .echo-fact span {
      display: block;

    .echo-fact strong {
      color: var(--cyan-bright);
      font: 650 14px/1.1 var(--mono);
    }

    .echo-fact span {
      margin-top: 4px;
      color: var(--paper-faint);

    .echo-decisions .small-button[aria-pressed="true"] {

      letter-spacing: .09em;

    .echo-occurrence {

      border: 1px solid rgba(179, 229, 255, .08);

      left: 2px;

    .structure-head {

      margin: 0 2px 9px;

      text-transform: uppercase;

      gap: 7px;

      flex: var(--pulse-grow, 1) 0 132px;

      border: 1px solid rgba(179, 229, 255, .11);
      border-radius: 11px;
      background: rgba(9, 11, 17, .58);

      text-align: left;

    .pulse-title,
    .pulse-meta {

    .pulse-title {
      overflow: hidden;
      margin-bottom: 8px;
      font: 600 11px/1.2 var(--sans);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pulse-meta {
      color: var(--paper-faint);
      font: 9px/1.25 var(--mono);
    }

    .pulse-signal {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      border-radius: 0 3px 3px 0;
      background: linear-gradient(90deg, var(--orange), #f2a46f);
      box-shadow: 0 0 10px rgba(232, 93, 74, .34);

    #structure-board {
      display: grid;
      gap: 30px;
      padding-bottom: 80px;
    }

    .board-zone {
      display: grid;
      gap: 12px;
    }

    .board-zone[hidden] {
      display: none;
    }

    .board-zone-head {
      display: flex;
      min-height: 32px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .board-zone-head h2 {
      margin: 0;
      color: var(--paper-dim);
      font: 600 11px/1 var(--mono);
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .board-zone-head span {
      color: var(--paper-faint);
      font: 10px/1 var(--mono);
    }

    .structure-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 255px), 1fr));
      gap: 14px;
      margin: 0;
      padding-left: 0;
      list-style: none;
      align-items: stretch;
    }

    .outline-empty {
      grid-column: 1 / -1;
      padding: 50px 24px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--paper-faint);
      text-align: center;
    }

    .block-card {
      position: relative;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      gap: 9px;
      align-items: start;
      padding: 14px 14px 14px 10px;
      border: 1px solid rgba(179, 229, 255, .1);
      border-radius: 14px;
      background: rgba(15, 19, 28, .68);
      box-shadow: 0 8px 26px rgba(0, 0, 0, .16);
      transition: border-color .16s, background .16s, opacity .16s, transform .16s;
    }

    .structure-grid .block-card {
      display: flex;
      min-height: 216px;
      flex-direction: column;
      gap: 12px;
      padding: 15px;
    }

    .block-card:hover,
    .block-card:focus-within,
    .block-card[data-selected="true"] {
      border-color: rgba(179, 229, 255, .27);
      background: rgba(23, 29, 40, .86);
    }

    .structure-grid .block-card[data-kind="heading"] {
      border-color: rgba(197, 160, 89, .21);
      background:
        linear-gradient(145deg, rgba(197, 160, 89, .09), transparent 58%),
        rgba(15, 19, 28, .76);
    }

    .structure-grid .block-card[data-level="2"] {
      border-color: rgba(197, 160, 89, .15);
      background:
        linear-gradient(145deg, rgba(197, 160, 89, .055), rgba(89, 194, 255, .025) 58%, transparent),
        rgba(15, 19, 28, .76);
    }

    .structure-grid .block-card[data-level="3"] {
      border-color: rgba(89, 194, 255, .16);
      background:
        linear-gradient(145deg, rgba(89, 194, 255, .045), transparent 56%),
        rgba(15, 19, 28, .76);
    }

    .structure-grid .block-card[data-editing="true"] {
      grid-column: 1 / -1;
      min-height: auto;
    }

    .block-card[data-dragging="true"] {
      opacity: .35;
    }

    .block-card[data-drop="true"] {
      transform: translateY(3px);
      border-top-color: var(--cyan);

    .drag-handle {
      display: grid;

      place-items: center;
      border: 0;
      background: transparent;
      color: var(--paper-faint);
      cursor: grab;

    .drag-handle:active { cursor: grabbing; }

    .block-main {
      display: flex;
      min-width: 0;
      flex: 1 1 auto;
      flex-direction: column;
    }

    .block-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
      min-height: 18px;
      margin-bottom: 7px;
      color: var(--paper-faint);
      font: 9px/1.2 var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;

    .status-chip {

      border: 1px solid rgba(89, 194, 255, .17);
      border-radius: 999px;
      color: var(--paper-dim);

    .status-chip.flow {
      border-style: dashed;
      color: var(--cyan-bright);

    .block-text {
      display: block;
      width: 100%;
      overflow: hidden;
      padding: 0;
      border: 0;
      background: transparent;

      height: 24px;

    .structure-grid.spine-list [data-kind="heading"] .block-text {

      justify-content: space-between;
      gap: 16px;
      padding: 11px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(3, 6, 10, .32);
    }

    #document-hub-summary {
      overflow: hidden;
      color: var(--paper-faint);
      font: 10px/1.4 var(--mono);
      letter-spacing: .07em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .document-view-toggle {
      display: flex;
      flex: 0 0 auto;
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(3, 6, 10, .52);
    }

    .document-view-button {
      min-height: 38px;
      padding: 0 13px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--paper-dim);
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
    }

    .document-view-button[aria-pressed="true"] {
      background: var(--paper);
      color: var(--ink);
    }

    #document-create-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      padding: 14px 24px;
      border-bottom: 1px solid rgba(197, 160, 89, .22);
      background: rgba(197, 160, 89, .055);
    }

    #document-create-form[hidden] {
      display: none;
    }

    #document-create-form label {
      grid-column: 1 / -1;
      color: var(--amber);
      font: 10px/1 var(--mono);
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    #new-document-title {
      min-width: 0;
      min-height: 44px;
      padding: 0 13px;
      border: 1px solid rgba(197, 160, 89, .34);
      border-radius: 10px;
      outline: 0;
      background: rgba(3, 6, 10, .55);
      color: var(--paper);
      font: 17px/1.2 var(--serif);
    }

    .document-hub-body {
      min-height: 0;
      overflow: auto;
      flex: 1 1 auto;
      padding: 20px 24px 24px;
    }

    #document-list-view[hidden],
    #document-graph-view[hidden] {
      display: none;
    }

    #document-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
      gap: 10px;
    }

    .document-list-item {
      display: grid;
      min-width: 0;
      min-height: 118px;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      gap: 13px;
      align-items: start;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(179, 229, 255, .025);
      color: var(--paper);
      cursor: pointer;
      text-align: left;
      transition: border-color .18s, background .18s, transform .18s var(--ease);
    }

    .document-list-item:hover,
    .document-list-item:focus-visible {
      border-color: rgba(89, 194, 255, .42);
      background: rgba(89, 194, 255, .055);
      transform: translateY(-2px);
    }

    .document-list-item[aria-current="true"] {
      border-color: rgba(197, 160, 89, .48);
      background: rgba(197, 160, 89, .055);
      box-shadow: inset 0 0 24px rgba(197, 160, 89, .035);
    }

    .document-glyph {
      position: relative;
      display: grid;
      width: 44px;
      height: 52px;
      place-items: center;
      border: 1px solid rgba(89, 194, 255, .38);
      border-radius: 7px 12px 7px 7px;
      background:
        linear-gradient(145deg, rgba(179, 229, 255, .18), rgba(23, 78, 108, .12)),
        rgba(3, 6, 10, .62);
      box-shadow: 0 0 16px rgba(89, 194, 255, .12);
      color: var(--cyan-bright);
      font: 9px/1 var(--mono);
      letter-spacing: .08em;
    }

    .document-glyph::after {
      position: absolute;
      top: -1px;
      right: -1px;
      width: 13px;
      height: 13px;
      border-bottom: 1px solid rgba(89, 194, 255, .3);
      border-left: 1px solid rgba(89, 194, 255, .3);
      border-radius: 0 10px 0 5px;
      background: rgba(89, 194, 255, .12);
      content: "";
    }

    [aria-current="true"] > .document-glyph,
    .document-node[aria-current="true"] .document-glyph {
      border-color: rgba(197, 160, 89, .64);
      box-shadow: 0 0 18px rgba(197, 160, 89, .16);
      color: var(--amber);
    }

    .document-list-copy {
      min-width: 0;
    }

    .document-list-copy strong {
      display: block;
      overflow: hidden;
      color: var(--paper);
      font: 500 19px/1.2 var(--serif);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .document-list-meta,
    .document-list-preview {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .document-list-meta {
      margin-top: 7px;
      color: var(--cyan);
      font: 9px/1.3 var(--mono);
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .document-list-preview {
      margin-top: 10px;
      color: var(--paper-dim);
      font: 13px/1.45 var(--serif);
    }

    .document-list-open {
      align-self: center;
      color: var(--paper-faint);
      font: 9px/1 var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    #document-graph-view {
      display: grid;
      min-height: 100%;
      grid-template-rows: auto minmax(430px, 1fr);
      gap: 10px;
    }

    #document-graph-status {
      min-height: 22px;
      margin: 0;
      color: var(--paper-dim);
      font: 11px/1.55 var(--mono);
    }

    #document-graph-stage {
      position: relative;
      min-height: 430px;
      overflow: hidden;
      border: 1px solid rgba(179, 229, 255, .1);
      border-radius: 18px;
      background:
        radial-gradient(circle at 50% 48%, rgba(89, 194, 255, .075), transparent 28rem),
        linear-gradient(rgba(179, 229, 255, .018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(179, 229, 255, .018) 1px, transparent 1px),
        rgba(3, 6, 10, .36);
      background-size: auto, 32px 32px, 32px 32px, auto;
    }

    #document-graph-svg,
    #document-graph-nodes {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #document-graph-svg {
      overflow: visible;
      pointer-events: none;
    }

    .document-similarity-edge {
      stroke: var(--cyan);
      stroke-linecap: round;
      transition: opacity .16s, stroke .16s;
    }

    .document-similarity-edge[data-dimmed="true"] {
      opacity: .08 !important;
    }

    .document-similarity-edge[data-highlighted="true"] {
      stroke: var(--cyan-bright);
      opacity: .95 !important;
    }

    .document-node {
      position: absolute;
      top: 0;
      left: 0;
      display: grid;
      width: clamp(132px, 17vw, 180px);
      min-height: 94px;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 11px;
      border: 1px solid rgba(89, 194, 255, .3);
      border-radius: 15px;
      background: rgba(11, 16, 24, .94);
      box-shadow: 0 12px 32px rgba(0, 0, 0, .36), 0 0 20px rgba(89, 194, 255, .07);
      color: var(--paper);
      cursor: pointer;
      text-align: left;
      transform: translate3d(var(--doc-x), var(--doc-y), 0) translate(-50%, -50%);
      transition: opacity .18s, filter .18s, border-color .18s, box-shadow .18s, transform .18s var(--ease);
    }

    .document-node:hover,
    .document-node:focus-visible,
    .document-node[data-highlighted="true"] {
      z-index: 2;
      border-color: rgba(179, 229, 255, .68);
      box-shadow: 0 16px 42px rgba(0, 0, 0, .48), 0 0 28px rgba(89, 194, 255, .18);
      transform: translate3d(var(--doc-x), var(--doc-y), 0) translate(-50%, -50%) scale(1.035);
    }

    .document-node[aria-current="true"] {
      border-color: rgba(197, 160, 89, .68);
      box-shadow: 0 14px 38px rgba(0, 0, 0, .44), 0 0 24px rgba(197, 160, 89, .14);
    }

    .document-node[data-dimmed="true"] {
      opacity: .24;
      filter: saturate(.42);
    }

    .document-node[data-insufficient="true"] {
      border-style: dashed;
    }

    .document-node .document-glyph {
      width: 36px;
      height: 43px;
      border-radius: 6px 10px 6px 6px;
    }

    .document-node-copy {
      min-width: 0;
    }

    .document-node-kicker {
      display: block;
      margin-bottom: 5px;
      color: var(--cyan);
      font: 8px/1 var(--mono);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .document-node[aria-current="true"] .document-node-kicker {
      color: var(--amber);
    }

    .document-node-title {
      display: -webkit-box;
      overflow: hidden;
      color: var(--paper);
      font: 500 15px/1.2 var(--serif);
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .document-node-meta {
      display: block;
      margin-top: 6px;
      color: var(--paper-faint);
      font: 8px/1.2 var(--mono);
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    #scrim {
      position: fixed;
      z-index: 65;
      inset: 0;
      border: 0;
      background: rgba(0, 0, 0, .44);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }

    #scrim[data-open="true"] {
      opacity: 1;
      pointer-events: auto;
    }

    .utility-body {
      display: grid;
      gap: 22px;
      padding: 18px 20px 30px;
    }

    .setting-group {
      display: grid;
      gap: 10px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .setting-group:first-child {
      padding-top: 0;
      border-top: 0;
    }

    .setting-group h3 {
      margin: 0;
      color: var(--paper-faint);
      font: 9px/1 var(--mono);
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      color: var(--paper-dim);
      font-size: 12px;
    }

    .range-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--paper-dim);
      font-size: 12px;
    }

    .range-label output {
      color: var(--cyan-bright);
      font-family: var(--mono);
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 42px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: 0;
      background: rgba(179, 229, 255, .04);
      color: var(--paper);
    }

    .field input[type="range"] {
      padding: 0;
      accent-color: var(--cyan);
    }

    .font-profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .font-profile-choice {
      position: relative;
      min-width: 0;
      cursor: pointer;
    }

    .font-profile-choice input {
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .font-profile-card {
      display: grid;
      min-height: 112px;
      align-content: space-between;
      gap: 13px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(179, 229, 255, .025);
      transition: border-color .16s, background .16s, box-shadow .16s;
    }

    .font-profile-choice input:hover + .font-profile-card {
      border-color: rgba(179, 229, 255, .28);
      background: rgba(179, 229, 255, .045);
    }

    .font-profile-choice input:focus-visible + .font-profile-card {
      outline: 2px solid var(--cyan-bright);
      outline-offset: 3px;
    }

    .font-profile-choice input:checked + .font-profile-card {
      border-color: rgba(255, 216, 105, .5);
      background: rgba(255, 216, 105, .07);
      box-shadow: inset 0 0 0 1px rgba(255, 216, 105, .08);
    }

    .font-profile-name {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      color: var(--paper);
      font: 650 11px/1 var(--sans);
    }

    .font-profile-name small {
      color: var(--paper-faint);
      font: 8px/1 var(--mono);
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .font-profile-preview {
      overflow: hidden;
      color: var(--paper-dim);
      font: 16px/1.3 var(--profile-font);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .font-profile-choice[data-font-profile="vav"] {
      --profile-font: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, ui-serif, serif;
    }

    .font-profile-choice[data-font-profile="bok"] {
      --profile-font: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, ui-serif, serif;
    }

    .font-profile-choice[data-font-profile="ren"] {
      --profile-font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .font-profile-choice[data-font-profile="klar"] {
      --profile-font: Verdana, Geneva, "DejaVu Sans", Arial, sans-serif;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .button-grid .plain-button {
      min-height: 44px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .stat {
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(179, 229, 255, .025);
    }

    .stat strong {
      display: block;
      color: var(--paper);
      font: 600 19px/1 var(--mono);
    }

    .stat span {
      display: block;
      margin-top: 6px;
      color: var(--paper-faint);
      font: 9px/1 var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .method-note {
      margin: 0;
      color: var(--paper-faint);
      font-size: 12px;
      line-height: 1.65;
    }

    .support-card {
      display: grid;
      gap: 12px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(179, 229, 255, .025);
    }

    .support-card-head {
      display: flex;
      min-height: 44px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .support-card-title {
      display: grid;
      gap: 3px;
    }

    .support-card-title strong {
      color: var(--paper);
      font-size: 13px;
    }

    .support-card-title span,
    #timer-state {
      color: var(--paper-faint);
      font: 9px/1.35 var(--mono);
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .check-control {
      display: flex;
      min-height: 44px;
      align-items: center;
      gap: 8px;
      color: var(--paper-dim);
      cursor: pointer;
      font-size: 12px;
    }

    .check-control input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--cyan);
    }

    .receipt-options {
      display: grid;
      margin: 2px 0 0;
      padding: 14px 0 0;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      border: 0;
      border-top: 1px solid rgba(179, 229, 255, .08);
    }

    .receipt-options legend {
      padding: 0 0 8px;
      color: var(--paper-dim);
      font: 600 10px/1.2 var(--mono);
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .receipt-options .check-control {
      min-height: 44px;
      justify-content: flex-start;
      padding: 8px 10px;
      border: 1px solid rgba(179, 229, 255, .08);
      border-radius: 9px;
      background: rgba(179, 229, 255, .018);
    }

    .support-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .support-progress {
      display: grid;
      gap: 7px;
    }

    .support-progress[hidden],
    #custom-minutes-field[hidden],
    #timer-finished-actions[hidden] {
      display: none;
    }

    .support-progress progress {
      width: 100%;
      height: 7px;
      overflow: hidden;
      border: 0;
      border-radius: 999px;
      background: rgba(179, 229, 255, .08);
      color: var(--cyan);
      accent-color: var(--cyan);
    }

    .support-progress progress::-webkit-progress-bar {
      border-radius: 999px;
      background: rgba(179, 229, 255, .08);
    }

    .support-progress progress::-webkit-progress-value {
      border-radius: 999px;
      background: linear-gradient(90deg, var(--cyan-deep), var(--cyan));
    }

    .support-progress progress::-moz-progress-bar {
      border-radius: 999px;
      background: linear-gradient(90deg, var(--cyan-deep), var(--cyan));
    }

    .support-progress p {
      margin: 0;
      color: var(--paper-dim);
      font: 11px/1.45 var(--mono);
      font-variant-numeric: tabular-nums;
    }

    .sound-card {
      overflow: hidden;
    }

    .sound-card + .sound-card {
      margin-top: 10px;
    }

    .sound-theme-copy {
      min-height: 3.5em;
      margin: 0;
      color: var(--paper-dim);
      font: 12px/1.65 var(--serif);
    }

    .sound-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 8px;
    }

    .sound-controls .plain-button {
      min-width: 104px;
    }

    .sound-volume {
      display: grid;
      gap: 7px;
    }

    .sound-volume input {
      width: 100%;
      margin: 0;
      accent-color: var(--cyan);
    }

    #sound-volume-output {
      color: var(--paper-dim);
      font: 10px/1 var(--mono);
      font-variant-numeric: tabular-nums;
    }

    #sound-support-note[data-warning="true"] {
      color: var(--amber);
    }

    #timer-display {
      padding: 15px 12px;
      border: 1px solid rgba(179, 229, 255, .1);
      border-radius: 10px;
      background: rgba(3, 6, 10, .42);
      color: var(--cyan-bright);
      font: 600 25px/1 var(--mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: .04em;
      text-align: center;
    }

    #timer-display[data-words="true"] {
      font-size: 14px;
    }

    #timer-finished-actions {
      display: grid;
      gap: 8px;
    }

    .device-card-head {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-icon-preview {
      width: 58px;
      height: 58px;
      flex: 0 0 auto;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .32);
    }

    .install-instructions {
      margin: 0;
      padding-left: 22px;
      color: var(--paper-dim);
      font-size: 12px;
      line-height: 1.7;
    }

    .install-instructions[hidden],
    .data-transfer-note[hidden],
    #install-card[hidden],
    #update-card[hidden],
    #device-settings[hidden] {
      display: none;
    }

    .data-transfer-note {
      display: grid;
      gap: 9px;
      padding: 11px;
      border: 1px solid rgba(197, 160, 89, .22);
      border-radius: 9px;
      background: rgba(197, 160, 89, .055);
    }

    .data-transfer-note p {
      margin: 0;
      color: var(--paper-dim);
      font-size: 12px;
      line-height: 1.55;
    }

    #install-nudge {
      position: fixed;
      z-index: 90;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      display: grid;
      width: min(360px, calc(100vw - 32px));
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 12px;
      padding: 13px;
      border: 1px solid rgba(179, 229, 255, .2);
      border-radius: 17px;
      background: rgba(10, 13, 20, .97);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .62);
      color: var(--paper);
    }

    #install-nudge[hidden] {
      display: none;
    }

    #install-nudge img {
      width: 48px;
      height: 48px;
      border-radius: 12px;
    }

    .install-nudge-copy {
      display: grid;
      gap: 4px;
    }

    .install-nudge-copy strong {
      font-size: 13px;
    }

    .install-nudge-copy span {
      color: var(--paper-dim);
      font-size: 11px;
      line-height: 1.45;
    }

    .install-nudge-actions {
      display: flex;
      grid-column: 1 / -1;
      gap: 8px;
    }

    .install-nudge-actions .plain-button {
      min-height: 44px;
      flex: 1 1 0;
    }

    .danger {
      border-color: rgba(232, 93, 74, .22) !important;
      color: #f29b8f !important;
    }

    #toast {
      position: fixed;
      z-index: 100;
      bottom: max(22px, env(safe-area-inset-bottom));
      left: 50%;
      max-width: calc(100vw - 32px);
      padding: 10px 15px;
      border: 1px solid rgba(179, 229, 255, .2);
      border-radius: 999px;
      background: var(--glass-strong);
      box-shadow: 0 12px 36px rgba(0, 0, 0, .45);
      color: var(--cyan-bright);
      font: 11px/1.3 var(--mono);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px);
      transition: opacity .18s, transform .25s var(--ease);
    }

    #toast[data-show="true"] {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .commit-ghost {
      position: fixed;
      z-index: 43;
      max-width: min(30rem, calc(100vw - 32px));
      overflow: hidden;
      color: #ffe48a;
      font: 500 clamp(16px, 2vw, 22px)/1.4 var(--serif);
      opacity: .92;
      pointer-events: none;

      let end = blocks.length;

        if (blocks[i].kind === 'heading' && blocks[i].level <= block.level) {
          end = i;
          break;
        }
      }
      return { start: index, end };
    }

    function siblingHeadingIndex(index, direction) {
      const blocks = activeDocument().blocks;
      const block = blocks[index];
      if (!block || block.kind !== 'heading') return null;
      const owner = analysis.owners.get(block.id) || null;
      if (direction < 0) {
        for (let i = index - 1; i >= 0; i--) {
          if (blocks[i].kind === 'heading' &&
              blocks[i].level === block.level &&
              (analysis.owners.get(blocks[i].id) || null) === owner) return i;
        }
      } else {
        const ownRange = sectionRange(index);
        for (let i = ownRange.end; i < blocks.length; i++) {
          if (blocks[i].kind === 'heading' &&
              blocks[i].level === block.level &&
              (analysis.owners.get(blocks[i].id) || null) === owner) return i;
        }
      }
      return null;
    }

    function paragraphSiblingIndex(index, direction) {
      const blocks = activeDocument().blocks;
      const block = blocks[index];
      if (!block || block.kind !== 'paragraph') return null;
      const owner = analysis.owners.get(block.id) || null;
      const siblings = blocks
        .map((item, itemIndex) => ({ item, itemIndex }))
        .filter(entry =>
          entry.item.kind === 'paragraph' &&
          (analysis.owners.get(entry.item.id) || null) === owner
        )
        .map(entry => entry.itemIndex);
      const position = siblings.indexOf(index);
      return siblings[position + direction] ?? null;
    }

    function canMoveUnit(index, direction) {
      const block = activeDocument().blocks[index];
      if (!block) return false;
      if (block.kind === 'heading') return siblingHeadingIndex(index, direction) !== null;
      return paragraphSiblingIndex(index, direction) !== null;
    }

    function moveUnitRange(blockId) {
      const blocks = activeDocument().blocks;
      const index = blocks.findIndex(block => block.id === blockId);
      if (index < 0) return null;
      return { ...sectionRange(index), index, block: blocks[index] };
    }

    function validMoveBoundaries(blockId) {
      const blocks = activeDocument().blocks;
      const range = moveUnitRange(blockId);
      const boundaries = new Set();
      if (!range) return boundaries;
      if (range.block.kind === 'paragraph') {
        for (let boundary = 0; boundary <= blocks.length; boundary++) {
          if (boundary !== range.start && boundary !== range.end) boundaries.add(boundary);
        }
      } else {
        const owner = analysis.owners.get(range.block.id) || null;
        blocks.forEach((block, index) => {
          if (block.id === blockId || block.kind !== 'heading' || block.level !== range.block.level) return;
          if ((analysis.owners.get(block.id) || null) !== owner) return;
          boundaries.add(index);
          boundaries.add(sectionRange(index).end);
        });
        boundaries.delete(range.start);
        boundaries.delete(range.end);
        for (const boundary of [...boundaries]) {
          if (boundary > range.start && boundary < range.end) boundaries.delete(boundary);
        }
      }
      return boundaries;
    }

    function moveBoundaryContext(blockId, boundary) {
      const blocks = activeDocument().blocks;
      const range = moveUnitRange(blockId);
      if (!range) return { label: 'Placera här', detail: '' };
      const remaining = blocks.filter((_, index) => index < range.start || index >= range.end);
      const insertion = boundary > range.end ? boundary - (range.end - range.start) : boundary;
      const previous = remaining[insertion - 1];
      const next = remaining[insertion];
      const relation = previous && next
        ? `mellan "${snippet(previous.text, 28)}" och "${snippet(next.text, 28)}"`
        : (previous
          ? `efter "${snippet(previous.text, 38)}"`
          : (next ? `före "${snippet(next.text, 38)}"` : 'i dokumentet'));
      return { label: 'Placera här', detail: relation };
    }

    function liftedMoveDescription(blockId) {
      const range = moveUnitRange(blockId);
      if (!range) return '';
      if (range.block.kind === 'heading') {
        const count = range.end - range.start;
        return `Flyttar sektionen "${snippet(range.block.text, 46)}" med ${count} block`;
      }
      return `Flyttar stycke ${range.index + 1}`;
    }

    function cancelLiftedMove(shouldAnnounce = true) {
      const id = liftedMove?.id;
      liftedMove = null;
      if (view === 'structure') renderOutline();
      if (id) focusBlockControl(id);
      if (shouldAnnounce) announce('Flytten avbröts. Dokumentordningen är oförändrad.');
    }

    function startLiftedMove(blockId) {
      if (!guardActiveEdit()) return;
      const range = moveUnitRange(blockId);
      if (!range) return;
      const destinations = validMoveBoundaries(blockId);
      if (!destinations.size) {
        toast(range.block.kind === 'heading'
          ? 'Sektionen har ingen annan giltig plats på samma rubriknivå'
          : 'Stycket har ingen annan plats att flytta till');
        return;
      }
      if (view !== 'structure') {
        lastVavbordFocusId = blockId;
        if (elements.inspector.dataset.open === 'true' && closeInspector() === false) return;
        switchVavbordView('list');
        requestAnimationFrame(() => startLiftedMove(blockId));
        return;
      }
      liftedMove = { id: blockId };
      lastVavbordFocusId = blockId;
      renderOutline();
      requestAnimationFrame(() => {
        const firstTarget = $('.writing-seam[data-valid-move="true"]', elements.outline);
        firstTarget?.focus();
        firstTarget?.scrollIntoView({ behavior: REDUCED_MOTION ? 'auto' : 'smooth', block: 'center' });
      });
      announce(liftedMoveDescription(blockId) + '. Välj en lysande flyttsöm och tryck Enter för att placera. Escape avbryter.');
    }

    function moveUnitToBoundary(blockId, boundary) {
      if (!guardActiveEdit()) return false;
      const blocks = activeDocument().blocks;
      const range = moveUnitRange(blockId);
      const destination = Number(boundary);
      if (!range || !validMoveBoundaries(blockId).has(destination)) return false;
      const moveLabel = range.block.kind === 'heading' ? 'Flytta sektion' : 'Flytta stycke';
      pushHistory(moveLabel);
      const unit = blocks.splice(range.start, range.end - range.start);
      const insertion = destination > range.end ? destination - unit.length : destination;
      blocks.splice(clamp(insertion, 0, blocks.length), 0, ...unit);
      liftedMove = null;
      saveState();
      recalculate();
      requestAnimationFrame(() => {
        const card = $(`[data-block-id="${CSS.escape(unit[0].id)}"]`, elements.structureBoard);
        card?.focus();
        card?.scrollIntoView({ behavior: REDUCED_MOTION ? 'auto' : 'smooth', block: 'nearest' });
      });
      const newIndex = blocks.findIndex(block => block.id === unit[0].id);
      announce((unit[0].kind === 'heading' ? 'Sektionen' : 'Blocket') + ' flyttades till position ' + (newIndex + 1));
      toast((unit[0].kind === 'heading' ? 'Sektionen' : 'Stycket') + ' flyttades. Ångra med Ctrl eller Cmd + Z.');
      return true;
    }

    function moveBlockUnit(index, direction) {
      const blocks = activeDocument().blocks;
      const block = blocks[index];
      if (!block || !canMoveUnit(index, direction)) return;
      const targetIndex = block.kind === 'heading'
        ? siblingHeadingIndex(index, direction)
        : paragraphSiblingIndex(index, direction);
      if (targetIndex == null) return;
      const boundary = direction < 0
        ? targetIndex
        : (block.kind === 'heading' ? sectionRange(targetIndex).end : targetIndex + 1);
      moveUnitToBoundary(block.id, boundary);
    }

    function deleteBlock(id) {
      if (!guardActiveEdit()) return;
      const index = activeDocument().blocks.findIndex(block => block.id === id);
      if (index < 0) return;
      const range = sectionRange(index);
      const count = range.end - range.start;
      const label = count > 1 ? 'rubriken och dess sektion' : 'blocket';
      if (!confirm('Radera ' + label + '?')) return;
      pushHistory(count > 1 ? 'Radera sektion' : 'Radera block');
      const document = activeDocument();
      const removedIds = new Set(document.blocks.slice(range.start, range.end).map(block => block.id));
      if (document.lastCommittedBlockId && removedIds.has(document.lastCommittedBlockId)) {
        document.lastCommittedBlockId = null;
        document.lastCommittedBlockUnavailable = true;
      }
      document.blocks.splice(range.start, count);
      const focusId = document.blocks[Math.min(index, document.blocks.length - 1)]?.id;
      if (selectedId === id) closeInspector();
      saveState();
      recalculate();
      if (focusId) focusBlockControl(focusId);
      toast(count > 1 ? 'Sektionen raderades' : 'Blocket raderades');
    }

    function focusBlockControl(id) {
      requestAnimationFrame(() => {
        const card = $(`[data-block-id="${CSS.escape(id)}"]`, elements.structureBoard);
        card?.focus();
      });
    }

    function startEditing(id) {
      const block = activeDocument().blocks.find(item => item.id === id);
      if (!block) return;
      if (editingId) return void guardActiveEdit();
      if (view === 'structure' && elements.inspector.dataset.open === 'true') closeInspector();
      editingId = id;
      editingSnapshot = JSON.stringify(activeDocument().blocks);
      editingBuffer = block.kind === 'heading'
        ? '#'.repeat(block.level) + ' ' + block.text
        : block.text;
      addBlockRevision(block, block, 'Före redigering');
      editingCheckpointText = editingBuffer;
      saveState('Skyddspunkt sparad');
      if (view === 'graph') {
        selectedId = id;
        stopSimulation();
        renderInspector(id);
        requestAnimationFrame(() => {
          const textarea = $('#node-edit-text', elements.inspectorContent);
          textarea?.focus();
          textarea?.setSelectionRange(textarea.value.length, textarea.value.length);
        });
        return;
      }
      structureSectionId = null;
      renderOutline();
      const card = $(`[data-block-id="${CSS.escape(id)}"]`, elements.structureBoard);
      const textarea = $('textarea', card);
      textarea?.focus();
      textarea?.setSelectionRange(textarea.value.length, textarea.value.length);
      card?.scrollIntoView({ behavior: REDUCED_MOTION ? 'auto' : 'smooth', block: 'center' });
    }

    function startEditingCurrentHeading() {
      if (!structureSectionId) return;
      if (editingId) return void guardActiveEdit();
      const block = activeDocument().blocks.find(item => item.id === structureSectionId);
      if (!block || block.kind !== 'heading') return;
      editingId = block.id;
      editingSnapshot = JSON.stringify(activeDocument().blocks);
      editingBuffer = block.text;
      addBlockRevision(block, block, 'Före redigering');
      editingCheckpointText = editingBuffer;
      saveState('Skyddspunkt sparad');
      renderOutline();
      requestAnimationFrame(() => {
        elements.structureHeadingInput.focus();
        elements.structureHeadingInput.select();
      });
    }

    function saveCurrentHeading() {
      const block = activeDocument().blocks.find(item => item.id === structureSectionId);
      const text = elements.structureHeadingInput.value.trim().replace(/\s+/g, ' ');
      if (!block || block.kind !== 'heading' || !text) return toast('Rubriken kan inte vara tom');
      undoStack.push({ label: 'Redigera rubrik', blocks: editingSnapshot });
      if (undoStack.length > 60) undoStack.shift();
      redoStack = [];
      block.text = text;
      editingId = null;
      editingSnapshot = null;
      editingBuffer = null;
      editingCheckpointText = null;
      saveState();
      recalculate();
      elements.structureEditHeading.focus();
      toast('Rubriken uppdaterades');
      announce('Rubriken uppdaterades');
    }

    function cancelEditing() {
      const id = editingId;
      editingId = null;
      editingSnapshot = null;
      editingBuffer = null;
      editingCheckpointText = null;
      if (view === 'graph' && id) {
        renderInspector(id);
        requestAnimationFrame(() => nodeStates.get(id)?.element.focus());
        startSimulation('graph');
      } else {
        renderOutline();
        if (id) focusBlockControl(id, 'edit');
      }
    }

    function saveEditing(id) {
      const card = $(`[data-block-id="${CSS.escape(id)}"]`, elements.structureBoard);
      const textarea = $('#node-edit-text', elements.inspectorContent) || (card ? $('textarea', card) : null);
      const parsed = parseDraft(textarea?.value ?? editingBuffer ?? '');
      if (!parsed.text) return toast('Ett block kan inte vara tomt');
      undoStack.push({ label: 'Redigera block', blocks: editingSnapshot });
      if (undoStack.length > 60) undoStack.shift();
      redoStack = [];
      const block = activeDocument().blocks.find(item => item.id === id);
      block.kind = parsed.kind;
      block.level = parsed.level;
      block.text = parsed.text;
      editingId = null;
      editingSnapshot = null;
      editingBuffer = null;
      editingCheckpointText = null;
      saveState();
      recalculate();
      selectNode(id, false);
      if (view === 'graph') {
        renderInspector(id);
        requestAnimationFrame(() => nodeStates.get(id)?.element.focus());
      } else {
        focusBlockControl(id, 'edit');
      }
      toast('Blocket uppdaterades');
    }

    function buildStructureTree(blocks = activeDocument().blocks) {
      const root = {
        id: null,
        headingBlock: null,
        level: 0,
        start: 0,
        end: blocks.length,
        parentId: null,
        directParagraphs: [],
        childSections: []
      };
      const sections = new Map([[null, root]]);
      const stack = [root];

      blocks.forEach((block, index) => {
        if (block.kind === 'heading') {
          while (stack.length > 1 && stack[stack.length - 1].level >= block.level) {
            stack.pop().end = index;
          }
          const parent = stack[stack.length - 1];
          const section = {
            id: block.id,
            headingBlock: block,
            level: block.level,
            start: index,
            end: blocks.length,
            parentId: parent.id,
            directParagraphs: [],
            childSections: []
          };
          parent.childSections.push(section);
          sections.set(section.id, section);
          stack.push(section);
        } else {
          stack[stack.length - 1].directParagraphs.push({ block, index });
        }
      });
      while (stack.length > 1) stack.pop().end = blocks.length;
      return { root, sections };
    }

    function sectionStats(section) {
      const blocks = activeDocument().blocks.slice(section.start, section.end);
      const paragraphs = blocks.filter(block => block.kind === 'paragraph');
      const words = paragraphs.reduce((sum, block) => sum + wordCount(block.text), 0);
      const documentReady = analysis.nodes.filter(node => node.kind === 'paragraph').length >= 4;
      let assessed = 0;
      let issues = 0;
      paragraphs.forEach(block => {
        const node = analysis.nodesById.get(block.id);
        if (!documentReady || !node || node.insufficient) return;
        assessed += 1;
        if (node.lonely || node.flow) issues += 1;
      });
      return {
        paragraphs,
        words,
        assessed,
        unassessed: paragraphs.length - assessed,
        issues
      };
    }

    function pulseAssessment(item) {
      const issueRatio = item.assessed ? item.issues / item.assessed : 0;
      if (!item.paragraphs) {
        return { issueRatio, assessment: 'Tom sektion', shortAssessment: 'tom sektion' };
      }
      if (!item.assessed) {
        return {
          issueRatio,
          assessment: 'För litet analysunderlag',
          shortAssessment: 'för litet underlag'
        };
      }
      if (item.issues) {
        return {
          issueRatio,
          assessment: `${item.issues} lexikala signaler att granska`,
          shortAssessment: `${item.issues} signaler`
        };
      }
      if (item.unassessed) {
        return {
          issueRatio,
          assessment: `Inga signaler bland bedömda stycken, ${item.unassessed} kan inte bedömas`,
          shortAssessment: `${item.unassessed} ej bedömda`
        };
      }
      return {
        issueRatio,
        assessment: 'Inga uppmätta lexikala signaler',
        shortAssessment: 'inga signaler'
      };
    }

    function structurePath(section, sections) {
      const path = [];
      let cursor = section;
      while (cursor?.id) {
        path.unshift(cursor);
        cursor = sections.get(cursor.parentId);
      }
      return path;
    }

    function openStructureSection(id, focusFirst = true) {
      if (!guardActiveEdit()) return;
      if (elements.inspector.dataset.open === 'true') closeInspector();
      structureSectionId = id || null;
      selectedId = null;
      renderOutline();
      if (focusFirst) {
        requestAnimationFrame(() => {
          const first = $('.block-card', elements.structureBoard);
          const fallback = elements.structureUp.hidden ? $('#structure-add') : elements.structureUp;
          (first || fallback)?.focus();
        });
      }
    }

    function beginWritingAt(index) {
      if (!guardActiveEdit()) return;
      const blocks = activeDocument().blocks;
      const insertion = clamp(Number(index) || 0, 0, blocks.length);
      const previous = blocks[insertion - 1];
      const next = blocks[insertion];
      const label = previous && next
        ? `mellan "${snippet(previous.text, 28)}" och "${snippet(next.text, 28)}"`
        : (previous ? `efter "${snippet(previous.text, 36)}"` : (next ? `före "${snippet(next.text, 36)}"` : 'i det tomma dokumentet'));
      pendingInsertContext = {
        documentId: app.activeId,
        sectionId: analysis.owners.get(next?.id || previous?.id) || null,
        index: insertion,
        label
      };
      switchView('write');
      toast('Nästa block vävs in ' + label);
      announce('Skrivläget öppnades. Nästa block vävs in ' + label);
    }

    function beginContextualWriting() {
      beginWritingAt(activeDocument().blocks.length);
    }

    function editMarkup(block) {
      const canonicalText = block.kind === 'heading'
        ? '#'.repeat(block.level) + ' ' + block.text
        : block.text;
      const displayText = editingId === block.id && editingBuffer != null ? editingBuffer : canonicalText;
      const index = activeDocument().blocks.findIndex(item => item.id === block.id);
      const editLabel = block.kind === 'heading'
        ? `Redigerar rubrik H${block.level}`
        : `Redigerar stycke ${index + 1}`;
      const titleId = `edit-title-${block.id}`;
      const noteId = `edit-note-${block.id}`;
      return `<div class="edit-area edit-focus-card" role="group" aria-labelledby="${escapeHtml(titleId)}">

          <span class="edit-focus-mark" aria-hidden="true">✎</span>
          <div>

        <textarea aria-label="${escapeHtml(editLabel)}" aria-describedby="${escapeHtml(noteId)}">${escapeHtml(displayText)}</textarea>
        <div class="edit-buttons">
          <button class="small-button" data-action="cancel">Avbryt</button>
          <button class="small-button primary" data-action="save">Spara ändring</button>
        </div>
        <p class="edit-shortcut">Ctrl eller Cmd + Enter sparar · Escape avbryter</p>
      </div>`;
    }

    function paragraphCard(entry) {

          </button>

            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20h4l11-11a2.8 2.8 0 0 0-4-4L4 16v4Z"/></svg>

          </button>

    function sectionCard(section) {
      const block = section.headingBlock;
      const index = section.start;
      const stats = sectionStats(section);
      const editing = editingId === block.id;
      const preview = stats.paragraphs.slice(0, 2).map(item => item.text).join(' ');
      const thread = [

      ].join('');
