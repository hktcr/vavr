          </button>
          <button class="icon-button" data-action="down" aria-label="Flytta sektionen senare" ${canMoveUnit(index, 1) ? '' : 'disabled'}>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 10 6 6 6-6"/></svg>
          </button>
          <button class="icon-button" data-action="edit" aria-label="Redigera rubrik">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20h4l11-11a2.8 2.8 0 0 0-4-4L4 16v4Z"/></svg>
          </button>
          <button class="icon-button" data-action="delete" aria-label="Radera sektion">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 7h14M9 7V4h6v3M8 10v8M12 10v8M16 10v8M7 7l1 14h8l1-14"/></svg>
          </button>
        </div>
      </li>`;
    }

    function writingSeam(index, total) {
      if (liftedMove) {
        const valid = validMoveBoundaries(liftedMove.id).has(index);
        if (!valid) return '<li class="writing-seam-row move-seam-row" data-valid-move="false" aria-hidden="true"></li>';
        const destination = moveBoundaryContext(liftedMove.id, index);
        return `<li class="writing-seam-row move-seam-row" data-valid-move="true">
          <button class="writing-seam move-seam" type="button" data-move-boundary="${index}" data-valid-move="true"
                  aria-label="${escapeHtml(destination.label + ', ' + destination.detail)}">
            <span class="writing-seam-mark" aria-hidden="true">◇</span>
            <span class="writing-seam-copy">Placera här</span>
            <small>${escapeHtml(destination.detail)}</small>
          </button>
        </li>`;
      }
      const label = total === 0
        ? 'Skriv dokumentets första block'
        : (index === 0 ? 'Skriv före första blocket' : (index === total ? 'Skriv efter sista blocket' : `Skriv mellan block ${index} och ${index + 1}`));
      return `<li class="writing-seam-row">
        <button class="writing-seam" type="button" data-writing-index="${index}" aria-label="${escapeHtml(label)}">
          <span class="writing-seam-mark" aria-hidden="true">+</span>
          <span class="writing-seam-copy">Skriv här</span>
        </button>
      </li>`;
    }

    function liftedMoveBanner() {
      if (!liftedMove) return '';
      return `<li class="move-session" role="status">
        <div>
          <span class="eyebrow">Lyft och placera</span>
          <strong>${escapeHtml(liftedMoveDescription(liftedMove.id))}</strong>
          <small>Välj en lysande flyttsöm. Endast giltiga platser visas.</small>
        </div>
        <button class="small-button" type="button" data-cancel-move>Avbryt flytt</button>
      </li>`;
    }

    function spineCard(block, index) {
      const node = analysis.nodesById.get(block.id);
      const editing = editingId === block.id;
      const liftedRange = liftedMove ? moveUnitRange(liftedMove.id) : null;
      const lifted = liftedMove?.id === block.id;
      const liftedUnit = Boolean(liftedRange && index >= liftedRange.start && index < liftedRange.end);
      const tension = Boolean(node?.flow);
      const kindLabel = block.kind === 'heading' ? `Rubrik H${block.level}` : `Stycke ${index + 1}`;
      const tensionLabel = node?.flow
        ? 'Spänning mot annan plats'
        : (node?.lonely ? 'Öppet lexikalt glapp' : statusLabel(node));
      return `<li class="block-card spine-card" tabindex="-1" draggable="false"
                data-block-id="${escapeHtml(block.id)}" data-index="${index}"
                data-kind="${block.kind}" data-level="${block.level || ''}"
                data-editing="${editing}" data-selected="${String(selectedId === block.id)}"
                data-tension="${String(tension)}" data-lifted="${String(lifted)}"
                data-lifted-unit="${String(liftedUnit)}">
        <button class="spine-gutter" type="button" data-action="${lifted ? 'cancel-move' : 'lift'}"
                draggable="${!editingId && !liftedMove ? 'true' : 'false'}"
                aria-label="${lifted ? 'Avbryt flytt av ' : 'Lyft och flytta '}${escapeHtml(kindLabel.toLowerCase())}"
                title="${lifted ? 'Avbryt flytt' : 'Lyft och placera'}">
          <span class="spine-knot">${block.kind === 'heading' ? 'H' + block.level : '¶'}</span>
          <span class="spine-position">${String(index + 1).padStart(2, '0')}</span>
          <span class="spine-action-label">${lifted ? 'Lyft' : 'Flytta'}</span>
        </button>
        <div class="block-main">
          <div class="block-meta">
            <span>${kindLabel}</span>
            <span>${formatNumber(wordCount(block.text))} ord</span>
            <span class="status-chip ${node?.lonely ? 'lonely' : (node?.flow ? 'flow' : '')}">${escapeHtml(tensionLabel)}</span>
          </div>
          ${editing ? editMarkup(block) : `<button class="block-text" data-action="select">${escapeHtml(block.text)}</button>`}
        </div>
        <div class="block-tools">
          <button class="icon-button" data-action="versions" aria-label="Visa versioner för ${block.kind === 'heading' ? 'rubriken' : 'stycket'}" title="Versioner${block.revisions?.length ? ' (' + block.revisions.length + ')' : ''}">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.6"/><path d="M4 4v4.6h4.6M12 8v5l3 2"/></svg>
          </button>
          <button class="icon-button" data-action="lift" aria-label="Lyft och flytta ${block.kind === 'heading' ? 'sektionen' : 'stycket'}" title="Lyft och placera">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3v18M3 12h18M8 7l4-4 4 4M8 17l4 4 4-4M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg>
          </button>
          <button class="icon-button" data-action="edit" aria-label="Redigera ${block.kind === 'heading' ? 'rubrik' : 'stycke'}">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20h4l11-11a2.8 2.8 0 0 0-4-4L4 16v4Z"/></svg>
          </button>
          <button class="icon-button" data-action="delete" aria-label="Radera ${block.kind === 'heading' ? 'sektion' : 'stycke'}">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 7h14M9 7V4h6v3M8 10v8M12 10v8M16 10v8M7 7l1 14h8l1-14"/></svg>
          </button>
        </div>
      </li>`;
    }

    function focusGridNeighbor(card, key) {
      const grid = card.parentElement;
      const cards = $$('.block-card', grid);
      if (!cards.length) return;
      if (key === 'Home' || key === 'End') {
        (key === 'Home' ? cards[0] : cards[cards.length - 1]).focus();
        return;
      }
      const current = card.getBoundingClientRect();
      const cx = current.left + current.width / 2;
      const cy = current.top + current.height / 2;
      const candidates = cards.filter(candidate => {
        if (candidate === card) return false;
        const rect = candidate.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;
        if (key === 'ArrowLeft') return x < cx - 2;
        if (key === 'ArrowRight') return x > cx + 2;
        if (key === 'ArrowUp') return y < cy - 2;
        return y > cy + 2;
      });
      const horizontal = key === 'ArrowLeft' || key === 'ArrowRight';
      candidates.sort((a, b) => {
        const score = element => {
          const rect = element.getBoundingClientRect();
          const dx = Math.abs(rect.left + rect.width / 2 - cx);
          const dy = Math.abs(rect.top + rect.height / 2 - cy);
          return horizontal ? dx + dy * 2.2 : dy + dx * 1.4;
        };
        return score(a) - score(b);
      });
      if (candidates[0]) {
        candidates[0].focus();
      } else if (key === 'ArrowDown' && grid === elements.outline) {
        $('.block-card', elements.sectionGrid)?.focus();
      } else if (key === 'ArrowUp' && grid === elements.sectionGrid) {
        const paragraphCards = $$('.block-card', elements.outline);
        paragraphCards[paragraphCards.length - 1]?.focus();
      }
    }

    function wireStructureGrid(grid) {
      const cards = $$('.block-card', grid);
      const preferredCard = cards.find(card => card.dataset.blockId === (lastVavbordFocusId || selectedId)) || cards[0];
      cards.forEach(card => {
        card.tabIndex = card === preferredCard ? 0 : -1;
        if (card.dataset.editing !== 'true') {
          $$('button', card).forEach(button => button.tabIndex = -1);
        }
        const id = card.dataset.blockId;
        const index = Number(card.dataset.index);
        card.addEventListener('focus', () => {
          lastVavbordFocusId = id;
          cards.forEach(item => item.tabIndex = item === card ? 0 : -1);
        });
        card.addEventListener('keydown', event => {
          if (event.target !== card) return;
          if (event.key === ' ' || event.key.toLowerCase() === 'm') {
            event.preventDefault();
            startLiftedMove(id);
          } else if (event.altKey && (event.key === 'ArrowUp' || event.key === 'ArrowDown')) {
            event.preventDefault();
            moveBlockUnit(index, event.key === 'ArrowUp' ? -1 : 1);
          } else if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(event.key)) {
            event.preventDefault();
            focusGridNeighbor(card, event.key);
          } else if (event.key === 'Enter') {
            event.preventDefault();
            card.querySelector('[data-action="select"]')?.click();
          } else if (event.key.toLowerCase() === 'e') {
            event.preventDefault();
            startEditing(id);
          } else if (event.key.toLowerCase() === 'v') {
            event.preventDefault();
            openBlockVersions(id);
          } else if (event.key.toLowerCase() === 's') {
            event.preventDefault();
            beginWritingAt(index + 1);
          } else if (event.key === 'Delete') {
            event.preventDefault();
            deleteBlock(id);
          }
        });
        card.addEventListener('dragstart', event => {
          if (editingId || liftedMove || !event.target.closest('.spine-gutter')) return event.preventDefault();
          draggedBlockId = id;
          card.dataset.dragging = 'true';
          grid.dataset.dragging = 'true';
          const valid = validMoveBoundaries(id);
          $$('.writing-seam', grid).forEach(seam => {
            seam.dataset.validMove = String(valid.has(Number(seam.dataset.writingIndex)));
          });
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', id);
        });
        card.addEventListener('dragend', () => {
          draggedBlockId = null;
          delete card.dataset.dragging;
          delete grid.dataset.dragging;
          $$('.writing-seam', grid).forEach(seam => {
            delete seam.dataset.drop;
            if (!liftedMove) delete seam.dataset.validMove;
          });
        });
        card.addEventListener('dblclick', event => {
          if (!liftedMove && !event.target.closest('.block-tools, .spine-gutter')) startEditing(id);
        });
        $$('[data-action]', card).forEach(button => {
          button.addEventListener('click', () => {
            const action = button.dataset.action;
            if (action === 'cancel-move') cancelLiftedMove();
            else if (action === 'lift') startLiftedMove(id);
            else if (liftedMove) return;
            else if (action === 'open') openStructureSection(id);
            else if (action === 'select') {
              if (!guardActiveEdit()) return;
              selectedId = id;
              renderOutline();
              renderInspector(id);
              focusBlockControl(id, 'select');
            } else if (action === 'up') moveBlockUnit(index, -1);
            else if (action === 'down') moveBlockUnit(index, 1);
            else if (action === 'edit') startEditing(id);
            else if (action === 'versions') openBlockVersions(id);
            else if (action === 'delete') deleteBlock(id);
            else if (action === 'cancel') cancelEditing();
            else if (action === 'save') saveEditing(id);
          });
        });
        $('textarea', card)?.addEventListener('input', event => updateEditingBuffer(id, event.target.value));
        $('textarea', card)?.addEventListener('keydown', event => {
          if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
            event.preventDefault();
            saveEditing(id);
          } else if (event.key === 'Escape') {
            event.preventDefault();
            cancelEditing();
          }
        });
      });
      $$('.writing-seam', grid).forEach(seam => {
        seam.addEventListener('dragover', event => {
          if (!draggedBlockId || seam.dataset.validMove !== 'true') return;
          event.preventDefault();
          event.dataTransfer.dropEffect = 'move';
          seam.dataset.drop = 'true';
        });
        seam.addEventListener('dragleave', () => delete seam.dataset.drop);
        seam.addEventListener('drop', event => {
          if (!draggedBlockId || seam.dataset.validMove !== 'true') return;
          event.preventDefault();
          const movingId = draggedBlockId;
          const boundary = Number(seam.dataset.writingIndex);
          draggedBlockId = null;
          delete grid.dataset.dragging;
          moveUnitToBoundary(movingId, boundary);
        });
      });
    }

    function renderOutline() {
      if (view !== 'structure') return;
      const document = activeDocument();
      if (liftedMove && !moveUnitRange(liftedMove.id)) liftedMove = null;
      const metrics = documentMetrics(document);
      const tensionCount = analysis.nodes.filter(node => node.kind === 'paragraph' && node.flow).length;
      const tensionSummary = graphLens === 'tension'
        ? (tensionCount
          ? ` Spänningslinsen lyfter ${tensionCount} block där läsordning och ordsläktskap drar åt olika håll.`
          : ' Spänningslinsen hittar ingen mätbar dragkamp ännu, så övriga block lämnas fullt synliga.')
        : (tensionCount ? ` ${tensionCount} block bär uppmätt spänning.` : '');
      structureSectionId = null;
      elements.structureTitle.textContent = document.title;
      elements.structureSummary.textContent = liftedMove
        ? `${liftedMoveDescription(liftedMove.id)}. Välj en lysande flyttsöm. Escape avbryter.`
        : `${formatNumber(metrics.words)} ord · ${document.blocks.length} block${tensionSummary}`;
      elements.structureUp.hidden = true;
      elements.structureEditHeading.hidden = true;
      elements.structureHeadingEditor.hidden = true;
      elements.structureBreadcrumb.hidden = true;
      elements.structurePulsePanel.hidden = true;
      elements.paragraphZone.hidden = false;
      elements.sectionZone.hidden = true;
      elements.paragraphZoneCount.textContent = document.blocks.length + (document.blocks.length === 1 ? ' block' : ' block');
      elements.sectionZoneCount.textContent = '';
      elements.outline.classList.add('spine-list');
      elements.outline.dataset.moving = String(Boolean(liftedMove));
      elements.outline.innerHTML = [
        liftedMoveBanner(),
        writingSeam(0, document.blocks.length),
        ...document.blocks.flatMap((block, index) => [spineCard(block, index), writingSeam(index + 1, document.blocks.length)])
      ].join('');
      elements.sectionGrid.innerHTML = '';

      const seams = $$('.writing-seam', elements.outline);
      const activeSeamIndex = clamp(lastWritingSeamIndex, 0, Math.max(0, seams.length - 1));
      seams.forEach((button, position) => {
        button.tabIndex = position === activeSeamIndex ? 0 : -1;
        button.addEventListener('focus', () => {
          lastWritingSeamIndex = position;
          seams.forEach(item => item.tabIndex = item === button ? 0 : -1);
        });
        button.addEventListener('keydown', event => {
          if (event.key === 'Escape' && liftedMove) {
            event.preventDefault();
            cancelLiftedMove();
            return;
          }
          if (!['ArrowUp', 'ArrowDown', 'Home', 'End'].includes(event.key)) return;
          event.preventDefault();
          const targetPosition = event.key === 'Home'
            ? 0
            : (event.key === 'End' ? seams.length - 1 : clamp(position + (event.key === 'ArrowUp' ? -1 : 1), 0, seams.length - 1));
          seams[targetPosition]?.focus();
        });
        button.addEventListener('click', () => {
          lastWritingSeamIndex = position;
          if (button.dataset.moveBoundary != null && liftedMove) {
            moveUnitToBoundary(liftedMove.id, Number(button.dataset.moveBoundary));
          } else {
            beginWritingAt(Number(button.dataset.writingIndex));
          }
        });
      });
      $('[data-cancel-move]', elements.outline)?.addEventListener('click', () => cancelLiftedMove());
      wireStructureGrid(elements.outline);
      applyEchoHighlights();
    }

    function orderedDocuments() {
      return [
        ...app.documents.filter(document => document.id === app.activeId),
        ...app.documents.filter(document => document.id !== app.activeId)
      ];
    }

    function renderVavbordDock() {
      if (!elements.vavbordDocumentList) return;
      elements.vavbordDocumentList.innerHTML = orderedDocuments().map(document => {
        const active = document.id === app.activeId;
        const metrics = documentMetrics(document);
        return `<button class="vavbord-document" type="button"
          data-dock-document-id="${escapeHtml(document.id)}"
          aria-current="${String(active)}"
          aria-label="${escapeHtml(document.title)}, ${active ? 'öppet dokument, ' : ''}${formatNumber(metrics.words)} ord. Öppna dokumentet.">
            <span class="vavbord-document-glyph" aria-hidden="true">DOK</span>
            <span class="vavbord-document-copy">
              <strong>${escapeHtml(document.title || 'Namnlöst dokument')}</strong>
              <small>${active ? 'Öppet · ' : ''}${formatNumber(metrics.words)} ord</small>
            </span>
          </button>`;
      }).join('');
      $$('.vavbord-document', elements.vavbordDocumentList).forEach(button => {
        button.addEventListener('click', () => {
          const id = button.dataset.dockDocumentId;
          if (id === app.activeId) return button.focus();
          if (changeActiveDocument(id) === false) return;
          requestAnimationFrame(() => $('[aria-current="true"]', elements.vavbordDocumentList)?.focus());
        });
      });
    }

    function documentPreview(document) {
      const committed = documentContentText(document);
      const draft = String(document.draft || '').trim();
      return snippet(committed || draft || 'Tomt dokument. Öppna det för att börja skriva.', 118);
    }

    function renderDocumentList() {
      elements.documentList.innerHTML = orderedDocuments().map(document => {
        const metrics = documentMetrics(document);
        const active = document.id === app.activeId;
        return `<button class="document-list-item" type="button"
          data-document-id="${escapeHtml(document.id)}"
          aria-current="${String(active)}"
          aria-label="${escapeHtml(document.title || 'Namnlöst dokument')}, ${active ? 'aktivt dokument, ' : ''}${formatNumber(metrics.words)} ord. Öppna dokumentet.">
            <span class="document-glyph" aria-hidden="true">DOK</span>
            <span class="document-list-copy">
              <strong>${escapeHtml(document.title || 'Namnlöst dokument')}</strong>
              <span class="document-list-meta">${active ? 'Aktivt · ' : ''}${formatNumber(metrics.words)} ord · ${(document.blocks || []).length} block</span>
              <span class="document-list-preview">${escapeHtml(documentPreview(document))}</span>
            </span>
            <span class="document-list-open" aria-hidden="true">Öppna</span>
          </button>`;
      }).join('');
      $$('.document-list-item', elements.documentList).forEach(button => {
        button.addEventListener('click', () => openDocumentFromHub(button.dataset.documentId));
      });
    }

    function resetDocumentGraphFocus() {
      $$('.document-node', elements.documentGraphNodes).forEach(node => {
        delete node.dataset.highlighted;
        delete node.dataset.dimmed;
      });
      $$('.document-similarity-edge', elements.documentGraphSvg).forEach(edge => {
        delete edge.dataset.highlighted;
        delete edge.dataset.dimmed;
      });
      if (!documentGraphAnalysis) return;
      const assessed = documentGraphAnalysis.nodes.filter(node => !node.insufficient).length;
      if (documentGraphAnalysis.nodes.length < 2) {
        elements.documentGraphStatus.textContent = 'Skapa ytterligare ett dokument för att kunna jämföra dokumentens invävda text.';
      } else if (assessed < 2) {
        elements.documentGraphStatus.textContent = 'Minst två dokument behöver mer invävd text innan en försiktig likhetsjämförelse kan göras.';
      } else if (!documentGraphAnalysis.fullEdges.length) {
        elements.documentGraphStatus.textContent =
          'Inga lexikala kopplingar når tröskeln ' +
          documentGraphAnalysis.threshold.toFixed(2).replace('.', ',') +
          '. Utkast räknas inte.';
      } else {
        elements.documentGraphStatus.textContent =
          documentGraphAnalysis.fullEdges.length +
          (documentGraphAnalysis.fullEdges.length === 1 ? ' koppling' : ' kopplingar') +
          ' över tröskeln ' +
          documentGraphAnalysis.threshold.toFixed(2).replace('.', ',') +
          '. Linjerna visar TF/IDF-baserad cosinuslikhet mellan invävda texter.';
      }
    }

    function focusDocumentGraph(id) {
      if (!documentGraphAnalysis?.nodesById.has(id)) return;
      const connected = documentGraphAnalysis.adjacency.get(id) || new Set();
      $$('.document-node', elements.documentGraphNodes).forEach(node => {
        const same = node.dataset.documentId === id;
        const neighbor = connected.has(node.dataset.documentId);
        node.dataset.highlighted = String(same);
        node.dataset.dimmed = String(!same && !neighbor);
      });
      $$('.document-similarity-edge', elements.documentGraphSvg).forEach(edge => {
        const touches = edge.dataset.a === id || edge.dataset.b === id;
        edge.dataset.highlighted = String(touches);
        edge.dataset.dimmed = String(!touches);
      });

      const node = documentGraphAnalysis.nodesById.get(id);
      if (node.insufficient) {
        elements.documentGraphStatus.textContent =
          node.title + ': för lite invävd text för en tillförlitlig lexikal jämförelse.';
        return;
      }
      const strongest = documentGraphAnalysis.fullEdges
        .filter(edge => edge.a === id || edge.b === id)
        .sort((a, b) => b.score - a.score)[0];
      if (!strongest) {
        elements.documentGraphStatus.textContent =
          node.title + ': ingen koppling når den valda likhetströskeln.';
        return;
      }
      const otherId = strongest.a === id ? strongest.b : strongest.a;
      const other = documentGraphAnalysis.nodesById.get(otherId);
      elements.documentGraphStatus.textContent =
        node.title + ' ↔ ' + other.title +
        ': cosinuslikhet ' + Math.round(strongest.score * 100) + ' %, gemensamma nyckelord: ' +
        strongest.shared.join(', ') + '.';
    }

    function renderDocumentGraph() {
      if (elements.documentGraphView.hidden) return;
      documentGraphAnalysis = analyzeDocuments();
      const count = documentGraphAnalysis.nodes.length;
      const stageWidth = Math.max(280, elements.documentGraphStage.clientWidth || elements.documentGraphStage.getBoundingClientRect().width);
      const columns = stageWidth < 560 ? 2 : Math.max(2, Math.min(4, Math.ceil(Math.sqrt(Math.max(1, count) * 1.55))));
      const rows = Math.max(1, Math.ceil(count / columns));
      const stageHeight = clamp(430 + Math.max(0, rows - 2) * (stageWidth < 560 ? 145 : 118), 430, 980);
      elements.documentGraphStage.style.height = stageHeight + 'px';
      const positions = layoutDocumentGraph(
        documentGraphAnalysis.nodes,
        documentGraphAnalysis.edges,
        stageWidth,
        stageHeight
      );
      elements.documentGraphSvg.setAttribute('viewBox', `0 0 ${stageWidth} ${stageHeight}`);
      elements.documentGraphSvg.innerHTML = documentGraphAnalysis.edges.map(edge => {
        const a = positions.get(edge.a);
        const b = positions.get(edge.b);
        const normalized = clamp((edge.score - documentGraphAnalysis.threshold) / Math.max(.01, 1 - documentGraphAnalysis.threshold), 0, 1);
        const opacity = (.28 + Math.sqrt(normalized) * .58).toFixed(3);
        const width = (1.2 + Math.sqrt(normalized) * 3.4).toFixed(2);
        return `<line class="document-similarity-edge"
          data-a="${escapeHtml(edge.a)}" data-b="${escapeHtml(edge.b)}"
          x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}"
          x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}"
          style="opacity:${opacity};stroke-width:${width}"></line>`;
      }).join('');
      elements.documentGraphNodes.innerHTML = documentGraphAnalysis.nodes.map(node => {
        const position = positions.get(node.id);
        const active = node.id === app.activeId;
        const connections = documentGraphAnalysis.adjacency.get(node.id)?.size || 0;
        return `<button class="document-node" type="button"
          data-document-id="${escapeHtml(node.id)}"
          data-insufficient="${String(node.insufficient)}"
          aria-current="${String(active)}"
          aria-label="${escapeHtml(node.title)}, ${active ? 'aktivt dokument, ' : ''}${formatNumber(node.words)} ord, ${connections} ${connections === 1 ? 'synlig koppling' : 'synliga kopplingar'}. Öppna dokumentet."
          style="--doc-x:${position.x.toFixed(1)}px;--doc-y:${position.y.toFixed(1)}px">
            <span class="document-glyph" aria-hidden="true">DOK</span>
            <span class="document-node-copy">
              <span class="document-node-kicker">${active ? 'Aktivt dokument' : 'Dokument'}</span>
              <span class="document-node-title">${escapeHtml(node.title)}</span>
              <span class="document-node-meta">${formatNumber(node.words)} ord · ${node.blocks} block</span>
            </span>
          </button>`;
      }).join('');

      $$('.document-node', elements.documentGraphNodes).forEach(node => {
        const id = node.dataset.documentId;
        node.addEventListener('pointerenter', () => focusDocumentGraph(id));
        node.addEventListener('pointerleave', () => {
          if (document.activeElement !== node) resetDocumentGraphFocus();
        });
        node.addEventListener('focus', () => focusDocumentGraph(id));
        node.addEventListener('blur', () => {
          requestAnimationFrame(() => {
            if (!elements.documentGraphNodes.contains(document.activeElement)) resetDocumentGraphFocus();
          });
        });
        node.addEventListener('click', () => openDocumentFromHub(id));
      });
      resetDocumentGraphFocus();
    }

    function setDocumentHubView(nextView, persist = true) {
      const mode = nextView === 'graph' ? 'graph' : 'list';
      app.settings.documentHubView = mode;
      $$('[data-document-view]', elements.documentHub).forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.documentView === mode));
      });
      elements.documentListView.hidden = mode !== 'list';
      elements.documentGraphView.hidden = mode !== 'graph';
      if (persist) saveState('Dokumentvyn sparad');
      if (mode === 'graph') requestAnimationFrame(renderDocumentGraph);
      else renderDocumentList();
    }

    function renderDocumentHub() {
      const totalWords = app.documents.reduce((sum, document) => sum + documentMetrics(document).words, 0);
      elements.documentHubSummary.textContent =
        app.documents.length + (app.documents.length === 1 ? ' dokument' : ' dokument') +
        ' · ' + formatNumber(totalWords) + ' ord totalt';
      renderDocumentList();
      setDocumentHubView(app.settings.documentHubView, false);
    }

    function renderDocumentControls() {
      elements.documentSelect.innerHTML = app.documents.map(document =>
        `<option value="${escapeHtml(document.id)}">${escapeHtml(document.title)}</option>`
      ).join('');
      elements.documentSelect.value = app.activeId;
      elements.documentTitle.value = activeDocument().title;
      elements.activeDocumentLabel.textContent = activeDocument().title;
      elements.documentsButton.title = 'Dokument: ' + activeDocument().title;
      elements.documentsButton.setAttribute('aria-label', 'Öppna dokument. Aktivt dokument: ' + activeDocument().title);
      renderVavbordDock();
    }

    function renderStats() {
      const document = activeDocument();
      const metrics = documentMetrics(document);
      $('#stat-words').textContent = formatNumber(metrics.words);
      $('#stat-characters').textContent = formatNumber(metrics.characters);
      $('#stat-blocks').textContent = document.blocks.length;
      $('#stat-links').textContent = analysis.cohesionEdges.length;
      $('#threshold-output').textContent = Number(app.settings.threshold).toFixed(2).replace('.', ',');
      $('#edge-count-output').textContent = app.settings.maxEdges;
      elements.emptyGraph.hidden = document.blocks.length > 0;
      renderGoal();
      configureInstallUI();
    }

    function recalculate(bornId = null) {
      invalidateEcho();
      analysis = analyze(activeDocument().blocks);
      Soundscape.updateText(soundTextProfile());
      syncGraph(bornId);
      renderStats();
      renderOutline();
      if (view === 'echo') renderEcho();
      if (view === 'fulltext') renderFulltext();
      if (selectedId && analysis.nodesById.has(selectedId) && elements.inspector.dataset.open === 'true') {
        renderInspector(selectedId);
      } else if (selectedId && !analysis.nodesById.has(selectedId)) {
        closeInspector();
      }
      if (bornId) drawGraph();
      else if (view === 'graph') startSimulation('graph');
      else drawGraph();
    }

    function syncVavbordControls() {
      const mode = view === 'graph' ? 'nodes' : (view === 'echo' ? 'echo' : 'list');
      $$('[data-vavbord-view]', elements.vavbordToolbar).forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.vavbordView === mode));
      });
      elements.tensionLens.setAttribute('aria-pressed', String(graphLens === 'tension'));
      elements.tensionLens.setAttribute('aria-label', graphLens === 'tension' ? 'Släck Spänningslinsen' : 'Visa Spänningslinsen');
      const hasTension = Boolean(analysis?.nodes.some(node => node.flow));
      elements.body.dataset.tension = String(graphLens === 'tension' && hasTension);
    }

    function setTensionLens(active, shouldAnnounce = true) {
      if (!setGraphLens(active ? 'tension' : 'all', false)) return;
      if (view === 'structure') renderOutline();
      if (shouldAnnounce) {
        announce(active
          ? 'Spänningslinsen visar block där läsordning och ordsläktskap drar åt olika håll'
          : 'Spänningslinsen släcktes');
      }
    }

    function switchVavbordView(nextMode) {
      const mode = ['nodes', 'echo'].includes(nextMode) ? nextMode : 'list';
      if (!guardActiveEdit()) return;
      const nextView = mode === 'nodes' ? 'graph' : (mode === 'echo' ? 'echo' : 'structure');
      if (view === nextView) return syncVavbordControls();
      app.settings.vavbordView = mode;
      saveState('Vävbordets vy sparad');
      const update = () => switchView(nextView);
      if (!REDUCED_MOTION && typeof document.startViewTransition === 'function') {
        document.startViewTransition(update);
      } else {
        update();
      }
    }

    function switchView(nextView) {
      if (!['write', 'graph', 'structure', 'echo', 'fulltext'].includes(nextView)) return;
      if (nextView !== view && !guardActiveEdit()) return;
      if (nextView !== view && activeCommitEffects.size) cancelAllCommitEffects();
      if (nextView !== 'structure') {
        liftedMove = null;
        draggedBlockId = null;
      }
      view = nextView;
      if (nextView === 'graph' || nextView === 'structure' || nextView === 'echo') {
        app.settings.vavbordView = nextView === 'graph' ? 'nodes' : (nextView === 'echo' ? 'echo' : 'list');
      }
      elements.body.dataset.view = nextView;
      $$('.mode-button').forEach(button => {
        const active = button.dataset.viewTarget === nextView ||
          (button.dataset.viewTarget === 'vavbord' && ['graph', 'structure', 'echo'].includes(nextView));
        if (active) button.setAttribute('aria-current', 'page');
        else button.removeAttribute('aria-current');
      });
      syncVavbordControls();
      updateNodeInteractivity();
      if (nextView === 'write') {
        closeInspector();
        stopSimulation();
        for (let i = 0; i < 32; i++) physicsStep(1);
        updateNodePositions();
        drawGraph();
        renderTypewriterFocus();
        requestAnimationFrame(() => elements.draft.focus());
      } else if (nextView === 'graph') {
        renderOutline();
        startSimulation('graph');
        const selected = nodeStates.get(lastVavbordFocusId || selectedId)?.element;
        const first = [...nodeStates.values()].find(state => state.element.tabIndex === 0)?.element;
        requestAnimationFrame(() => {
          if (selected?.tabIndex === 0) selected.focus();
          else (first || $('[data-graph-lens][aria-pressed="true"]', elements.graphLens))?.focus();
        });
      } else if (nextView === 'structure') {
        stopSimulation();
        renderOutline();
        requestAnimationFrame(() => {
          const focusId = lastVavbordFocusId || selectedId;
          const selected = focusId
            ? $(`[data-block-id="${CSS.escape(focusId)}"]`, elements.structureBoard)
            : null;
          const target = selected || $('.block-card', elements.structureBoard) || $('.writing-seam', elements.structureBoard) || $('#structure-add');
          target?.scrollIntoView({ behavior: REDUCED_MOTION ? 'auto' : 'smooth', block: 'center' });
          target?.focus({ preventScroll: true });
        });
      } else if (nextView === 'echo') {
        closeInspector();
        stopSimulation();
        renderEcho();
        requestAnimationFrame(() => {
          const selected = echoSelectionId
            ? $(`[data-echo-id="${CSS.escape(echoSelectionId)}"]`, elements.echoField)
            : null;
          (selected || $('[aria-selected="true"]', elements.echoModeToggle))?.focus();
        });
      } else {
        closeInspector();
        stopSimulation();
        renderFulltext();
        requestAnimationFrame(() => elements.fulltextEdit.focus());
      }
      announce('Växlade till ' + (
        nextView === 'write'
          ? 'Skriv'
          : (nextView === 'graph'
            ? 'Vävbordets Noder'
            : (nextView === 'echo'
              ? 'Ordekon'
              : (nextView === 'fulltext' ? 'Heltext' : 'Vävbordets Lista')))
      ));
    }

    function applyWidth(index) {
      const safeIndex = normalizeWidthIndex(index);
      const width = WIDTHS[safeIndex];
      app.settings.widthIndex = safeIndex;
      elements.widthSlider.max = String(WIDTHS.length - 1);
      elements.widthSlider.value = safeIndex;
      elements.widthSlider.setAttribute(
        'aria-valuetext',
        (safeIndex === WIDTHS.length - 1 ? 'Maximal, ' : '') + formatNumber(width) + ' pixlar'
      );
      document.documentElement.style.setProperty('--composer-width', width + 'px');
    }

    function applyFontProfile(profile, relayout = false) {
      const safeProfile = normalizeFontProfile(profile);
      app.settings.fontProfile = safeProfile;
      document.documentElement.dataset.fontProfile = safeProfile;
      $$('input[name="font-profile"]', elements.fontProfileOptions).forEach(input => {
        input.checked = input.value === safeProfile;
      });
      elements.fontProfileStatus.textContent = FONT_PROFILES[safeProfile].description;
      if (!relayout) return;
      requestAnimationFrame(() => {
        autoSizeDraft();
        renderTypewriterFocus();
        resizeCanvas(true);
        if (view === 'structure' || view === 'graph') renderOutline();
        if (view === 'echo') renderEcho();
        if (elements.documentHub.dataset.open === 'true') renderDocumentHub();
      });
    }

    function setWorkspaceInert(inert) {
      const method = inert ? 'setAttribute' : 'removeAttribute';
      $('main')[method]('inert', '');
      $('#topbar')[method]('inert', '');
      elements.nodeLayer[method]('inert', '');
      elements.vavbordToolbar[method]('inert', '');
      elements.vavbordDock[method]('inert', '');
      if (inert) elements.inspector.setAttribute('inert', '');
      else if (elements.inspector.dataset.open === 'true') elements.inspector.removeAttribute('inert');
    }

    function showDocumentCreate() {
      elements.documentCreateForm.hidden = false;
      elements.newDocumentTitle.value = '';
      requestAnimationFrame(() => elements.newDocumentTitle.focus());
    }

    function hideDocumentCreate() {
      elements.documentCreateForm.hidden = true;
      elements.newDocumentTitle.value = '';
    }

    function openDocumentHub(showCreate = false) {
      if (!guardActiveEdit()) return;
      const fromUtility = elements.utility.dataset.open === 'true';
      if (fromUtility) closeUtility(false);
      activeDocument().draft = elements.draft.value;
      saveState();
      renderDocumentHub();
      documentHubReturnFocus = fromUtility ? elements.documentsButton : document.activeElement;
      setWorkspaceInert(true);
      elements.documentHub.dataset.open = 'true';
      elements.documentHub.removeAttribute('inert');
      elements.scrim.dataset.open = 'true';
      elements.documentsButton.setAttribute('aria-expanded', 'true');
      if (showCreate) {
        showDocumentCreate();
      } else {
        hideDocumentCreate();
        requestAnimationFrame(() => {
          const current = $('[aria-current="true"]', elements.documentListView);
          const graphCurrent = $('[aria-current="true"]', elements.documentGraphView);
          (elements.documentListView.hidden ? graphCurrent : current)?.focus();
        });
      }
      announce('Dokumentytan öppnades');
    }

    function closeDocumentHub(restoreFocus = true) {
      const wasOpen = elements.documentHub.dataset.open === 'true';
      elements.documentHub.dataset.open = 'false';
      elements.documentHub.setAttribute('inert', '');
      elements.scrim.dataset.open = 'false';
      elements.documentsButton.setAttribute('aria-expanded', 'false');
      hideDocumentCreate();
      documentGraphAnalysis = null;
      setWorkspaceInert(false);
      if (wasOpen && restoreFocus) requestAnimationFrame(() => documentHubReturnFocus?.focus?.());
    }

    function openDocumentFromHub(id) {
      if (!app.documents.some(document => document.id === id)) return;
      changeActiveDocument(id);
      closeDocumentHub(false);
      requestAnimationFrame(() => {
        if (view === 'write') elements.draft.focus();
        else if (view === 'graph') {
          [...nodeStates.values()].find(state => state.element.tabIndex === 0)?.element.focus();
        } else if (view === 'echo') {
          $('[aria-selected="true"]', elements.echoModeToggle)?.focus();
        } else {
          ($('.block-card', elements.structureBoard) || $('#structure-add'))?.focus();
        }
      });
    }

    function createDocumentFromHub(title) {
      const document = createDocument(String(title || '').trim() || 'Nytt dokument');
      app.documents.push(document);
      changeActiveDocument(document.id);
      closeDocumentHub(false);
      switchView('write');
      announce('Dokumentet ' + document.title + ' skapades och öppnades');
    }

    function openUtility(focusTarget = elements.documentSelect) {
      if (!guardActiveEdit()) return;
      if (elements.documentHub.dataset.open === 'true') closeDocumentHub(false);
      renderDocumentControls();
      renderGoal();
      renderTimer();
      renderTypewriterControls();
      renderSound();
      configureInstallUI();
      utilityReturnFocus = document.activeElement;
      setWorkspaceInert(true);
      elements.utility.dataset.open = 'true';
      elements.utility.removeAttribute('inert');
      elements.scrim.dataset.open = 'true';
      elements.utilityButton.setAttribute('aria-expanded', 'true');
      requestAnimationFrame(() => focusTarget?.focus?.());
    }

    function closeUtility(restoreFocus = true) {
      const wasOpen = elements.utility.dataset.open === 'true';
      elements.utility.dataset.open = 'false';
      elements.utility.setAttribute('inert', '');
      elements.scrim.dataset.open = 'false';
      elements.utilityButton.setAttribute('aria-expanded', 'false');
      setWorkspaceInert(false);
      if (wasOpen && restoreFocus) requestAnimationFrame(() => utilityReturnFocus?.focus?.());
    }

    function toast(message) {
      clearTimeout(toastTimer);
      elements.toast.textContent = message;
      elements.toast.dataset.show = 'true';
      toastTimer = setTimeout(() => elements.toast.dataset.show = 'false', 2400);
    }

    function announce(message) {
      if (!message) return;
      if (announceQueue[announceQueue.length - 1] !== message) announceQueue.push(message);
      if (announceTimer) return;
      const next = () => {
        const item = announceQueue.shift();
        if (!item) {
          announceTimer = null;
          return;
        }
        elements.live.textContent = '';
        requestAnimationFrame(() => elements.live.textContent = item);
        announceTimer = setTimeout(next, 650);
      };
      next();
    }

    function copyMarkdown() {
      const markdown = toMarkdown();
      const fallback = () => {
        const textarea = document.createElement('textarea');
        textarea.value = markdown;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        textarea.remove();
      };
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(markdown).then(() => toast('Markdown kopierad')).catch(() => {
          fallback();
          toast('Markdown kopierad');
        });
      } else {
        fallback();
        toast('Markdown kopierad');
      }
    }

    function downloadMarkdown() {
      const blob = new Blob([toMarkdown()], { type: 'text/markdown;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = (activeDocument().title || 'vavr-dokument').replace(/[^\p{L}\p{N}_-]+/gu, '-').replace(/^-|-$/g, '') + '.md';
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 0);
      toast('Markdown hämtad');
    }

    function downloadBackup(prefix = 'vavr-sakerhetskopia', statusMessage = 'Säkerhetskopian hämtades') {
      activeDocument().draft = elements.draft.value;
      saveState();
      const payload = {
        format: 'vavr-backup',
        version: 1,
        exportedAt: new Date().toISOString(),
        app
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = prefix + '-' + new Date().toISOString().slice(0, 10) + '.json';
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 0);
      toast(statusMessage);
      announce(statusMessage);
    }

    function restoreBackupData(payload) {
      cancelAllCommitEffects();
      hideCommitReceipt();
      const source = payload?.format === 'vavr-backup' ? payload.app : payload;
      if (!source || !Array.isArray(source.documents) || !source.documents.length) {
        throw new Error('Filen innehåller inga VävR-dokument.');
      }

      const defaults = createDefaultState();
      const documents = ensureUniqueDocumentIds(source.documents.map(document => ({
        ...createDocument(document.title || document.titel || 'Namnlöst dokument'),
        ...document,
        id: document.id || uid('d'),
        title: document.title || document.titel || 'Namnlöst dokument',
        blocks: normalizeBlocks(document.blocks || document.block || []),
        draft: String(document.draft || ''),
        recalledBlock: document.recalledBlock ? normalizeBlock(document.recalledBlock) : null,
        recalledIndex: Number.isInteger(Number(document.recalledIndex)) ? Math.max(0, Number(document.recalledIndex)) : null,
        lastCommittedBlockId: document.lastCommittedBlockId || null,
        lastCommittedBlockUnavailable: document.lastCommittedBlockUnavailable === true,
        goal: normalizeGoal(document.goal),
        echoDecisions: document.echoDecisions && typeof document.echoDecisions === 'object'
          ? { ...document.echoDecisions }
          : {}
      })));
      const settings = Object.assign({}, defaults.settings, source.settings || {});
      settings.focusMinutes = clamp(Math.round(Number(settings.focusMinutes) || 25), 1, 180);
      settings.breakMinutes = clamp(Math.round(Number(settings.breakMinutes) || 5), 1, 60);
      settings.widthIndex = normalizeWidthIndex(settings.widthIndex);
      settings.documentHubView = settings.documentHubView === 'graph' ? 'graph' : 'list';
      settings.vavbordView = ['nodes', 'echo'].includes(settings.vavbordView)
        ? settings.vavbordView
        : 'list';
      settings.echoMode = ['words', 'phrases', 'starters'].includes(settings.echoMode)
        ? settings.echoMode
        : 'words';
      settings.fontProfile = normalizeFontProfile(settings.fontProfile);
      settings.showCountdown = settings.showCountdown !== false;
      settings.typewriterView = settings.typewriterView === true;
      settings.typewriterContextIndex = normalizeTypewriterContextIndex(settings.typewriterContextIndex);
      settings.commitReceipts = normalizeCommitReceipts(settings.commitReceipts);
      settings.soundTheme = SOUND_THEMES[settings.soundTheme] ? settings.soundTheme : 'none';
      settings.soundVolume = clamp(
        Number.isFinite(Number(settings.soundVolume)) ? Math.round(Number(settings.soundVolume)) : 24,
        0,
        100
      );
      settings.soundReactive = settings.soundReactive !== false;
      settings.typewriterTheme = TYPEWRITER_THEMES[settings.typewriterTheme]
        ? settings.typewriterTheme
        : 'none';
      settings.typewriterVolume = clamp(
        Number.isFinite(Number(settings.typewriterVolume)) ? Math.round(Number(settings.typewriterVolume)) : 18,
        0,
        100
      );

      stopTimerTicker();
      Soundscape.stop(true);
      Typewriter.stop(true);
      app = {
        ...defaults,
        ...source,
        version: 13,
        documents,
        settings,
        timer: normalizeTimer(source.timer, settings.focusMinutes)
      };
      if (!documents.some(document => document.id === app.activeId)) app.activeId = documents[0].id;
      applyFontProfile(settings.fontProfile, true);
      applyWidth(settings.widthIndex);
      renderTypewriterControls();
      changeActiveDocument(app.activeId, false);
      renderTimer();
      renderSound();
      startTimerTicker();
      toast('Säkerhetskopian återställdes');
      announce('Säkerhetskopian återställdes');
    }

    function isStandaloneApp() {
      return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    }

    function detectInstallEnvironment() {
      if (isStandaloneApp()) return null;
      const agent = navigator.userAgent || '';
      const ipadLike = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
      const ios = /iPhone|iPad|iPod/i.test(agent) || ipadLike;
      if (!ios) return deferredInstallPrompt ? 'native' : null;
      const safari = /Safari/i.test(agent) && !/CriOS|FxiOS|EdgiOS|OPiOS/i.test(agent);
      return safari ? 'ios-safari' : 'ios-other';
    }

    function hasLocalWriting() {
      return app.documents.some(document =>
        document.blocks?.length || String(document.draft || '').trim()
      ) || Boolean(elements.draft.value.trim());
    }

    function installNudgeSnoozed() {
      try {
        const until = Number(localStorage.getItem('vavr-install-snooze') || 0);
        return until > Date.now();
      } catch (error) {
        return false;
      }
    }

    function hideInstallNudge(snooze = false) {
      clearTimeout(installNudgeTimer);
      elements.installNudge.hidden = true;
      if (snooze) {
        try {
          localStorage.setItem('vavr-install-snooze', String(Date.now() + 30 * 24 * 60 * 60 * 1000));
        } catch (error) {
          console.warn('Kunde inte spara installationsvalet.', error);
        }
      }
    }

    function maybeShowInstallNudge() {
      clearTimeout(installNudgeTimer);
      if (!installKind || isStandaloneApp() || installNudgeSnoozed()) return;
      if (commitsThisSession < 1 || app.timer.state !== 'idle' || elements.draft.value.trim()) return;
      installNudgeTimer = setTimeout(() => {
        if (app.timer.state === 'idle' && !elements.draft.value.trim() && elements.utility.dataset.open !== 'true') {
          $('#install-nudge-yes').textContent = installKind === 'native' ? 'Installera' : 'Visa hur';
          elements.installNudge.hidden = false;
        }
      }, 900);
    }

    function configureInstallUI() {
      installKind = detectInstallEnvironment();
      if (!installKind || isStandaloneApp()) {
        elements.installCard.hidden = true;
        elements.deviceSettings.hidden = elements.updateCard.hidden;
        hideInstallNudge(false);
        return;
      }

      elements.installCard.hidden = false;
      elements.deviceSettings.hidden = false;
      elements.iosInstallSteps.hidden = true;
      const localWriting = hasLocalWriting();
      elements.installDataNote.hidden = !installKind.startsWith('ios') || !localWriting;
      if (localWriting) hideInstallNudge(false);

      if (installKind === 'native') {
        elements.installTitle.textContent = 'Installera VävR';
        elements.installSubtitle.textContent = 'Öppna som en egen app';
        elements.installDescription.textContent = 'Lägg VävR på hemskärmen och använd verktyget i ett eget appfönster.';
        elements.installAction.textContent = 'Installera VävR';
      } else if (installKind === 'ios-safari') {
        elements.installTitle.textContent = 'Lägg till på hemskärmen';
        elements.installSubtitle.textContent = 'Installation via Safari';
        elements.installDescription.textContent = 'Safari installerar VävR genom menyn Dela. Tryck nedan för en kort vägledning.';
        elements.installAction.textContent = 'Visa installationssteg';
      } else {
        elements.installTitle.textContent = 'Lägg till på hemskärmen';
        elements.installSubtitle.textContent = 'Installation via webbläsarens Dela-meny';
        elements.installDescription.textContent = 'Välj Lägg till på hemskärmen i Dela-menyn. Om valet saknas kan du öppna sidan i Safari.';
        elements.installAction.textContent = 'Visa installationssteg';
      }
      maybeShowInstallNudge();
    }

    async function handleInstallAction() {
      hideInstallNudge(false);
      if (installKind === 'native' && deferredInstallPrompt) {
        const promptEvent = deferredInstallPrompt;
        deferredInstallPrompt = null;
        await promptEvent.prompt();
        const choice = await promptEvent.userChoice;
        if (choice.outcome !== 'accepted') {
          hideInstallNudge(true);
          installKind = null;
          elements.installCard.hidden = true;
          elements.deviceSettings.hidden = elements.updateCard.hidden;
        }
        return;
      }
      if (installKind === 'ios-safari') {
        elements.iosInstallSteps.hidden = false;
        elements.installAction.textContent = 'Installationsstegen visas ovan';
        elements.iosInstallSteps.scrollIntoView({ block: 'nearest', behavior: REDUCED_MOTION ? 'auto' : 'smooth' });
        return;
      }
      if (installKind === 'ios-other') {
        elements.iosInstallSteps.hidden = false;
        elements.installAction.textContent = 'Installationsstegen visas ovan';

    function showUpdateReady(registration) {

      elements.updateCard.hidden = false;
      elements.deviceSettings.hidden = false;
    }

    function watchServiceWorker(registration) {
      serviceWorkerRegistration = registration;
      if (registration.waiting) showUpdateReady(registration);
      registration.addEventListener('updatefound', () => {
        const worker = registration.installing;
        worker?.addEventListener('statechange', () => {
          if (worker.state === 'installed' && navigator.serviceWorker.controller) {
            showUpdateReady(registration);
          }
        });
      });
    }

    async function registerServiceWorker() {
      if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
      try {
        const registration = await navigator.serviceWorker.register('./sw.js', {
          scope: './',
          updateViaCache: 'none'
        });
        lastWorkerUpdateCheck = Date.now();
        watchServiceWorker(registration);

        console.warn('VävR kunde inte aktivera offlineläget.', error);

          grip.setPointerCapture(event.pointerId);

          const startWidth = elements.composer.getBoundingClientRect().width;
          const writeStyle = getComputedStyle(elements.writeView);
          const horizontalPadding =
            (parseFloat(writeStyle.paddingLeft) || 0) +
            (parseFloat(writeStyle.paddingRight) || 0);
          const widthLimit = Math.max(
            WIDTHS[0],
            elements.writeView.clientWidth - horizontalPadding - 48
          );
          const renderedWidths = WIDTHS.map(width => Math.min(width, widthLimit));
          const side = grip.classList.contains('left') ? -1 : 1;
          const move = moveEvent => {
            const wanted = startWidth + (moveEvent.clientX - startX) * side * 2;
            const closest = renderedWidths.reduce((best, width, index) =>
              Math.abs(width - wanted) < Math.abs(renderedWidths[best] - wanted)
                ? index
                : best, startIndex);
            applyWidth(closest);
          };
          const end = () => {
            grip.removeEventListener('pointermove', move);
            grip.removeEventListener('pointerup', end);
            grip.removeEventListener('pointercancel', end);
            saveState();
            resizeCanvas();

              !element.hasAttribute('inert') &&
              !element.closest('[hidden]') &&

            );
          if (focusable.length) {
            const first = focusable[0];

            if (event.shiftKey && document.activeElement === first) {
              event.preventDefault();
              last.focus();

        const document = createDocument(file.name.replace(/\.(md|markdown)$/i, '') || 'Importerat dokument');
        document.blocks = parseMarkdown(markdown);
        app.documents.push(document);
        changeActiveDocument(document.id);
        event.target.value = '';
        closeUtility();
        switchView('structure');
        toast('Markdown importerad som nytt dokument');
      });
      $('#backup-file').addEventListener('change', async event => {
        const file = event.target.files?.[0];
        if (!file) return;
        try {
          const payload = JSON.parse(await file.text());
          const source = payload?.format === 'vavr-backup' ? payload.app : payload;
          const count = Array.isArray(source?.documents) ? source.documents.length : 0;
          const exported = payload?.exportedAt
            ? new Date(payload.exportedAt).toLocaleString('sv-SE')
            : 'okänd tidpunkt';
          if (!count) throw new Error('Filen innehåller inga VävR-dokument.');
          if (!confirm(`Återställ ${count} dokument från ${exported}? Nuvarande dokument ersätts. En säkerhetskopia hämtas först.`)) return;
          downloadBackup('vavr-fore-aterstallning', 'Nuvarande dokument säkerhetskopierades');
          restoreBackupData(payload);
          closeUtility();
        } catch (error) {
          toast(error.message || 'Kunde inte återställa säkerhetskopian');
        } finally {
          event.target.value = '';
        }
      });

      elements.installAction.addEventListener('click', handleInstallAction);
      $('#install-nudge-yes').addEventListener('click', async () => {
        if (installKind === 'native') {
          await handleInstallAction();
        } else {
          hideInstallNudge(false);
          if (installKind === 'ios-safari') elements.iosInstallSteps.hidden = false;
          openUtility(elements.installAction);
        }
      });
      $('#install-nudge-no').addEventListener('click', () => hideInstallNudge(true));
      elements.applyUpdate.addEventListener('click', () => {
        activeDocument().draft = elements.draft.value;
        saveState('Utkast sparat');
        const waiting = serviceWorkerRegistration?.waiting;
        if (!waiting) return toast('Uppdateringen förbereds fortfarande');
        reloadForUpdate = true;
        waiting.postMessage({ type: 'SKIP_WAITING' });
      });

      $('#clear-document').addEventListener('click', () => {
        if (!activeDocument().blocks.length) return;
        if (!confirm('Töm hela dokumentet? Åtgärden kan ångras under denna session.')) return;
        pushHistory('Töm dokument');
        activeDocument().blocks = [];
        activeDocument().draft = '';
        activeDocument().recalledBlock = null;
        activeDocument().recalledIndex = null;
        activeDocument().lastCommittedBlockId = null;
        activeDocument().lastCommittedBlockUnavailable = false;
        recalledBlock = null;
        recalledIndex = null;
        elements.draft.value = '';
        resetDraftHistory(app.activeId, '');
        saveState();
        recalculate();
        updateDraftMeta();
        toast('Dokumentet tömdes');
      });
    }

    function initialize() {
      applyFontProfile(app.settings.fontProfile);
      applyWidth(app.settings.widthIndex);
      renderTypewriterControls();
      updateVisualViewport();
      elements.draft.value = activeDocument().draft || '';
      syncDraftHistory(app.activeId, elements.draft.value);
      recalledBlock = activeDocument().recalledBlock || null;
      recalledIndex = Number.isInteger(activeDocument().recalledIndex) ? activeDocument().recalledIndex : null;
      $('#threshold-input').value = app.settings.threshold;
      $('#edge-count-input').value = app.settings.maxEdges;
      renderDocumentControls();
      resizeCanvas(true);
      updateDraftMeta();
      analysis = analyze(activeDocument().blocks);
      syncGraph();
      const initialSteps = adaptiveStepCount(80);
      for (let i = 0; i < initialSteps; i++) {
        simulationAlpha = Math.max(.04, 1 - i / initialSteps);
        physicsStep(1);
      }
      simulationAlpha = 0;
      updateNodePositions();
      renderStats();
      renderTimer();
      renderSound();
      drawGraph();
      setupEvents();
      startTimerTicker();
      configureInstallUI();
      const scheduleRegistration = () => registerServiceWorker();
      if ('requestIdleCallback' in window) requestIdleCallback(scheduleRegistration, { timeout: 1800 });
      else setTimeout(scheduleRegistration, 600);
      requestAnimationFrame(() => elements.draft.focus());
    }

    initialize();
  })();
  </script>
</body>
</html>
